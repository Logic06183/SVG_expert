<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Learning Rate Effect - 3Blue1Brown Style</title>
  <desc>Three parallel gradient descents showing too small, optimal, and too large learning rates on identical loss surfaces</desc>

  <defs>
    <!-- 3Blue1Brown color palette -->
    <linearGradient id="lossGradientLowHigh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#29ABCA;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#E07856;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#FC6255;stop-opacity:1"/>
    </linearGradient>

    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#29ABCA;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#29ABCA;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#27AE60;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#27AE60;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FC6255;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#FC6255;stop-opacity:0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#111111"/>

  <!-- Title -->
  <g id="title" opacity="0">
    <text x="960" y="70" font-family="'SF Pro Display', 'Lato', sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      Learning Rate Effect
    </text>
    <text x="960" y="115" font-family="'SF Pro Display', sans-serif" font-size="32" fill="#888888" text-anchor="middle">
      Too Small vs Optimal vs Too Large
    </text>
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.8s" fill="freeze"/>
  </g>

  <!-- LEFT PANEL: Too Small (α = 0.001) - Cyan -->
  <g id="leftPanel" transform="translate(60, 180)">
    <rect x="0" y="0" width="540" height="580" fill="#1A1A1A" rx="10" stroke="#29ABCA" stroke-width="3" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.5s" fill="freeze"/>
    </rect>

    <text x="270" y="35" font-family="'SF Pro Display', sans-serif" font-size="32" font-weight="bold" fill="#29ABCA" text-anchor="middle" opacity="0">
      Too Small: α = 0.001
      <animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.5s" fill="freeze"/>
    </text>

    <!-- Contour plot -->
    <g id="leftContours" transform="translate(270, 320)">
      <!-- Contour levels (circular, representing convex loss) -->
      <ellipse cx="0" cy="0" rx="220" ry="160" fill="none" stroke="#FC6255" stroke-width="2" opacity="0.3"/>
      <ellipse cx="0" cy="0" rx="180" ry="130" fill="none" stroke="#E07856" stroke-width="2" opacity="0.4"/>
      <ellipse cx="0" cy="0" rx="140" ry="100" fill="none" stroke="#CF5044" stroke-width="2" opacity="0.5"/>
      <ellipse cx="0" cy="0" rx="100" ry="70" fill="none" stroke="#A8766A" stroke-width="2" opacity="0.6"/>
      <ellipse cx="0" cy="0" rx="60" ry="45" fill="none" stroke="#6B9BA8" stroke-width="2" opacity="0.7"/>
      <ellipse cx="0" cy="0" rx="30" ry="20" fill="none" stroke="#29ABCA" stroke-width="2.5" opacity="0.8"/>

      <!-- Global minimum -->
      <circle cx="0" cy="0" r="6" fill="#27AE60" opacity="0.8" filter="url(#glow)"/>

      <!-- Ball with very slow descent (many tiny steps) -->
      <g id="leftBall">
        <!-- Trail with many small segments -->
        <path d="M -180,-120 L -175,-116 L -170,-112 L -165,-108 L -160,-104 L -155,-100 L -150,-96 L -145,-92 L -140,-88 L -135,-84 L -130,-80 L -125,-76 L -120,-72 L -115,-68 L -110,-64 L -105,-60 L -100,-56 L -95,-52 L -90,-48 L -85,-44 L -80,-40 L -75,-36 L -70,-32 L -65,-28 L -60,-24 L -55,-20 L -50,-16 L -45,-12 L -40,-8"
              fill="none" stroke="#29ABCA" stroke-width="2" opacity="0" stroke-dasharray="400" stroke-dashoffset="400">
          <animate attributeName="stroke-dashoffset" from="400" to="0" begin="2s" dur="6s" fill="freeze"/>
          <animate attributeName="opacity" from="0" to="0.6" begin="2s" dur="0.3s" fill="freeze"/>
        </path>

        <!-- Ball -->
        <circle cx="0" cy="0" r="20" fill="url(#cyanGlow)" opacity="0">
          <animate attributeName="opacity" from="0" to="0.5" begin="2s" dur="0.3s" fill="freeze"/>
        </circle>
        <circle cx="0" cy="0" r="10" fill="#29ABCA" filter="url(#glow)" opacity="0">
          <animate attributeName="opacity" from="0" to="1" begin="2s" dur="0.3s" fill="freeze"/>
        </circle>

        <!-- Slow motion animation -->
        <animateMotion dur="6s" begin="2s" fill="freeze">
          <mpath href="#leftPath"/>
        </animateMotion>
      </g>

      <!-- Hidden path for motion -->
      <path id="leftPath" d="M -180,-120 L -175,-116 L -170,-112 L -165,-108 L -160,-104 L -155,-100 L -150,-96 L -145,-92 L -140,-88 L -135,-84 L -130,-80 L -125,-76 L -120,-72 L -115,-68 L -110,-64 L -105,-60 L -100,-56 L -95,-52 L -90,-48 L -85,-44 L -80,-40 L -75,-36 L -70,-32 L -65,-28 L -60,-24 L -55,-20 L -50,-16 L -45,-12 L -40,-8" fill="none" opacity="0"/>
    </g>

    <!-- Loss value -->
    <text x="270" y="540" font-family="'SF Pro Display', sans-serif" font-size="24" fill="#EEEEEE" text-anchor="middle" opacity="0">
      Loss: <tspan font-family="'SF Mono', monospace" fill="#29ABCA" font-size="28">0.247</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="7.5s" dur="0.5s" fill="freeze"/>
    </text>

    <!-- Status indicator -->
    <g id="leftStatus" transform="translate(180, 565)" opacity="0">
      <text x="0" y="0" font-family="sans-serif" font-size="20" fill="#FF9500">
        ⚠ Still descending...
      </text>
      <animate attributeName="opacity" from="0" to="1" begin="8s" dur="0.5s" fill="freeze"/>
    </g>
  </g>

  <!-- CENTER PANEL: Optimal (α = 0.1) - Green -->
  <g id="centerPanel" transform="translate(690, 180)">
    <rect x="0" y="0" width="540" height="580" fill="#1A1A1A" rx="10" stroke="#27AE60" stroke-width="4" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.5s" fill="freeze"/>
    </rect>

    <text x="270" y="35" font-family="'SF Pro Display', sans-serif" font-size="32" font-weight="bold" fill="#27AE60" text-anchor="middle" opacity="0">
      Optimal: α = 0.1
      <animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.5s" fill="freeze"/>
    </text>

    <!-- Contour plot -->
    <g id="centerContours" transform="translate(270, 320)">
      <!-- Identical contour levels -->
      <ellipse cx="0" cy="0" rx="220" ry="160" fill="none" stroke="#FC6255" stroke-width="2" opacity="0.3"/>
      <ellipse cx="0" cy="0" rx="180" ry="130" fill="none" stroke="#E07856" stroke-width="2" opacity="0.4"/>
      <ellipse cx="0" cy="0" rx="140" ry="100" fill="none" stroke="#CF5044" stroke-width="2" opacity="0.5"/>
      <ellipse cx="0" cy="0" rx="100" ry="70" fill="none" stroke="#A8766A" stroke-width="2" opacity="0.6"/>
      <ellipse cx="0" cy="0" rx="60" ry="45" fill="none" stroke="#6B9BA8" stroke-width="2" opacity="0.7"/>
      <ellipse cx="0" cy="0" rx="30" ry="20" fill="none" stroke="#29ABCA" stroke-width="2.5" opacity="0.8"/>

      <!-- Global minimum -->
      <circle cx="0" cy="0" r="6" fill="#27AE60" opacity="0.8" filter="url(#strongGlow)">
        <animate attributeName="r" values="6;10;6" begin="6s" dur="2s" repeatCount="indefinite"/>
      </circle>

      <!-- Ball with smooth, efficient descent -->
      <g id="centerBall">
        <!-- Trail -->
        <path d="M -180,-120 Q -120,-80 -60,-40 T 0,0"
              fill="none" stroke="#27AE60" stroke-width="3" opacity="0" stroke-dasharray="400" stroke-dashoffset="400">
          <animate attributeName="stroke-dashoffset" from="400" to="0" begin="2s" dur="4s" fill="freeze"/>
          <animate attributeName="opacity" from="0" to="0.8" begin="2s" dur="0.3s" fill="freeze"/>
        </path>

        <!-- Ball -->
        <circle cx="0" cy="0" r="22" fill="url(#greenGlow)" opacity="0">
          <animate attributeName="opacity" from="0" to="0.6" begin="2s" dur="0.3s" fill="freeze"/>
        </circle>
        <circle cx="0" cy="0" r="11" fill="#27AE60" filter="url(#strongGlow)" opacity="0">
          <animate attributeName="opacity" from="0" to="1" begin="2s" dur="0.3s" fill="freeze"/>
        </circle>

        <!-- Smooth motion animation -->
        <animateMotion dur="4s" begin="2s" fill="freeze" path="M -180,-120 Q -120,-80 -60,-40 T 0,0"/>
      </g>
    </g>

    <!-- Loss value -->
    <text x="270" y="540" font-family="'SF Pro Display', sans-serif" font-size="24" fill="#EEEEEE" text-anchor="middle" opacity="0">
      Loss: <tspan font-family="'SF Mono', monospace" fill="#27AE60" font-size="28">0.001</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="5.5s" dur="0.5s" fill="freeze"/>
    </text>

    <!-- Status indicator -->
    <g id="centerStatus" transform="translate(180, 565)" opacity="0">
      <text x="0" y="0" font-family="sans-serif" font-size="22" fill="#27AE60" font-weight="bold">
        ✓ Converged!
      </text>
      <animate attributeName="opacity" from="0" to="1" begin="6s" dur="0.5s" fill="freeze"/>
    </g>
  </g>

  <!-- RIGHT PANEL: Too Large (α = 0.5) - Red -->
  <g id="rightPanel" transform="translate(1320, 180)">
    <rect x="0" y="0" width="540" height="580" fill="#1A1A1A" rx="10" stroke="#FC6255" stroke-width="3" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.5s" fill="freeze"/>
    </rect>

    <text x="270" y="35" font-family="'SF Pro Display', sans-serif" font-size="32" font-weight="bold" fill="#FC6255" text-anchor="middle" opacity="0">
      Too Large: α = 0.5
      <animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.5s" fill="freeze"/>
    </text>

    <!-- Contour plot -->
    <g id="rightContours" transform="translate(270, 320)">
      <!-- Identical contour levels -->
      <ellipse cx="0" cy="0" rx="220" ry="160" fill="none" stroke="#FC6255" stroke-width="2" opacity="0.3"/>
      <ellipse cx="0" cy="0" rx="180" ry="130" fill="none" stroke="#E07856" stroke-width="2" opacity="0.4"/>
      <ellipse cx="0" cy="0" rx="140" ry="100" fill="none" stroke="#CF5044" stroke-width="2" opacity="0.5"/>
      <ellipse cx="0" cy="0" rx="100" ry="70" fill="none" stroke="#A8766A" stroke-width="2" opacity="0.6"/>
      <ellipse cx="0" cy="0" rx="60" ry="45" fill="none" stroke="#6B9BA8" stroke-width="2" opacity="0.7"/>
      <ellipse cx="0" cy="0" rx="30" ry="20" fill="none" stroke="#29ABCA" stroke-width="2.5" opacity="0.8"/>

      <!-- Global minimum -->
      <circle cx="0" cy="0" r="6" fill="#27AE60" opacity="0.8" filter="url(#glow)"/>

      <!-- Ball with oscillation and divergence -->
      <g id="rightBall">
        <!-- Trail showing oscillation -->
        <path d="M -180,-120 L -30,90 L 150,-80 L -50,100 L 200,-70 L -80,110"
              fill="none" stroke="#FC6255" stroke-width="3" opacity="0" stroke-dasharray="800" stroke-dashoffset="800">
          <animate attributeName="stroke-dashoffset" from="800" to="0" begin="2s" dur="6s" fill="freeze"/>
          <animate attributeName="opacity" from="0" to="0.7" begin="2s" dur="0.3s" fill="freeze"/>
        </path>

        <!-- Ball -->
        <circle cx="0" cy="0" r="20" fill="url(#redGlow)" opacity="0">
          <animate attributeName="opacity" from="0" to="0.5" begin="2s" dur="0.3s" fill="freeze"/>
        </circle>
        <circle cx="0" cy="0" r="10" fill="#FC6255" filter="url(#glow)" opacity="0">
          <animate attributeName="opacity" from="0" to="1" begin="2s" dur="0.3s" fill="freeze"/>
        </circle>

        <!-- Oscillating/diverging motion -->
        <animateMotion dur="6s" begin="2s" fill="freeze" path="M -180,-120 L -30,90 L 150,-80 L -50,100 L 200,-70 L -80,110"/>
      </g>
    </g>

    <!-- Loss value -->
    <text x="270" y="540" font-family="'SF Pro Display', sans-serif" font-size="24" fill="#EEEEEE" text-anchor="middle" opacity="0">
      Loss: <tspan font-family="'SF Mono', monospace" fill="#FC6255" font-size="28">2.831</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="7.5s" dur="0.5s" fill="freeze"/>
    </text>

    <!-- Status indicator -->
    <g id="rightStatus" transform="translate(180, 565)" opacity="0">
      <text x="0" y="0" font-family="sans-serif" font-size="20" fill="#FC6255" font-weight="bold">
        ✗ Diverged!
      </text>
      <animate attributeName="opacity" from="0" to="1" begin="8s" dur="0.5s" fill="freeze"/>
    </g>
  </g>

  <!-- Step count indicators -->
  <g id="stepCounts" transform="translate(0, 780)" opacity="0">
    <text x="330" y="0" font-family="'SF Mono', monospace" font-size="22" fill="#888888" text-anchor="middle">
      Steps: <tspan fill="#29ABCA">347</tspan>
    </text>
    <text x="960" y="0" font-family="'SF Mono', monospace" font-size="22" fill="#888888" text-anchor="middle">
      Steps: <tspan fill="#27AE60">12</tspan>
    </text>
    <text x="1590" y="0" font-family="'SF Mono', monospace" font-size="22" fill="#888888" text-anchor="middle">
      Steps: <tspan fill="#FC6255">∞</tspan>
    </text>
    <animate attributeName="opacity" from="0" to="1" begin="8.5s" dur="0.5s" fill="freeze"/>
  </g>

  <!-- Update formula -->
  <g id="updateFormula" transform="translate(960, 900)" opacity="0">
    <rect x="-450" y="-50" width="900" height="95" fill="#1A1A1A" opacity="0.95" rx="10" stroke="#444444" stroke-width="2"/>
    <text x="0" y="0" font-family="'SF Pro Display', sans-serif" font-size="48" fill="#EEEEEE" text-anchor="middle">
      <tspan font-style="italic">θ</tspan><tspan baseline-shift="sub" font-size="32">new</tspan> =
      <tspan font-style="italic">θ</tspan><tspan baseline-shift="sub" font-size="32">old</tspan> −
      <tspan fill="#FFFF00">α</tspan><tspan fill="#29ABCA">∇</tspan><tspan font-style="italic">L</tspan>(<tspan font-style="italic">θ</tspan>)
    </text>
    <text x="0" y="35" font-family="sans-serif" font-size="24" fill="#888888" text-anchor="middle">
      Choose <tspan fill="#FFFF00">α</tspan> wisely: too small = slow, too large = unstable
    </text>
    <animate attributeName="opacity" from="0" to="1" begin="9s" dur="0.8s" fill="freeze"/>
  </g>

  <!-- Comparison summary -->
  <g id="summary" transform="translate(100, 1000)" opacity="0">
    <text x="0" y="0" font-family="'SF Pro Display', sans-serif" font-size="28" fill="#EEEEEE" font-weight="bold">
      Summary:
    </text>
    <text x="150" y="0" font-family="sans-serif" font-size="24" fill="#29ABCA">
      Slow but steady
    </text>
    <text x="720" y="0" font-family="sans-serif" font-size="24" fill="#27AE60" font-weight="bold">
      Fast convergence ✓
    </text>
    <text x="1260" y="0" font-family="sans-serif" font-size="24" fill="#FC6255">
      Unstable, diverges
    </text>
    <animate attributeName="opacity" from="0" to="1" begin="10s" dur="0.8s" fill="freeze"/>
  </g>

  <!-- 3Blue1Brown watermark -->
  <g id="watermark" opacity="0.3">
    <text x="1700" y="1050" font-family="'SF Pro Display', sans-serif" font-size="18" fill="#666666" text-anchor="end">
      3B1B-Style Visualization
    </text>
  </g>
</svg>