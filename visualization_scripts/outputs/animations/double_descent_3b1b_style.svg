<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- 3Blue1Brown Style Double Descent Phenomenon Animation -->
  <defs>
    <!-- Gradients for curves -->
    <linearGradient id="classicalGradient">
      <stop offset="0%" style="stop-color:#FC6255;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#E07856;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#FC6255;stop-opacity:0.6"/>
    </linearGradient>

    <linearGradient id="modernGradient">
      <stop offset="0%" style="stop-color:#FC6255;stop-opacity:0.8"/>
      <stop offset="30%" style="stop-color:#E07856;stop-opacity:0.8"/>
      <stop offset="60%" style="stop-color:#29ABCA;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#27AE60;stop-opacity:0.8"/>
    </linearGradient>

    <!-- Regime background shading -->
    <linearGradient id="underfitShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FC6255;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#FC6255;stop-opacity:0.05"/>
    </linearGradient>

    <linearGradient id="interpolationShade">
      <stop offset="0%" style="stop-color:#E0A856;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#E0A856;stop-opacity:0.05"/>
    </linearGradient>

    <linearGradient id="overfitShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#29ABCA;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#29ABCA;stop-opacity:0.1"/>
    </linearGradient>

    <!-- Glow effects -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Surprise effect -->
    <filter id="surprise">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#111111"/>

  <!-- Title -->
  <g id="title">
    <text x="960" y="70" font-family="'SF Pro Display', 'Lato', sans-serif" font-size="64" font-weight="bold" fill="#FFFFFF" text-anchor="middle" opacity="0">
      The Double Descent Phenomenon
      <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.8s" fill="freeze"/>
    </text>
    <text x="960" y="115" font-family="'SF Pro Display', sans-serif" font-size="30" fill="#888888" text-anchor="middle" opacity="0">
      When bigger models surprisingly perform better
      <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.6s" fill="freeze"/>
    </text>
  </g>

  <!-- Main plot area -->
  <g id="mainPlot" transform="translate(200, 180)">
    <!-- Plot background -->
    <rect x="0" y="0" width="1520" height="750" fill="#1A1A1A" stroke="#444444" stroke-width="3" rx="15" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.5s" fill="freeze"/>
    </rect>

    <!-- Grid lines (subtle) -->
    <g id="gridLines" stroke="#2A2A2A" stroke-width="1" opacity="0">
      <!-- Horizontal -->
      <line x1="100" y1="150" x2="1420" y2="150"/>
      <line x1="100" y1="280" x2="1420" y2="280"/>
      <line x1="100" y1="410" x2="1420" y2="410"/>
      <line x1="100" y1="540" x2="1420" y2="540"/>
      <!-- Vertical -->
      <line x1="320" y1="50" x2="320" y2="650"/>
      <line x1="540" y1="50" x2="540" y2="650"/>
      <line x1="760" y1="50" x2="760" y2="650"/>
      <line x1="980" y1="50" x2="980" y2="650"/>
      <line x1="1200" y1="50" x2="1200" y2="650"/>
      <animate attributeName="opacity" from="0" to="0.3" begin="1.5s" dur="0.5s" fill="freeze"/>
    </g>

    <!-- Regime background shading -->
    <g id="regimeShading" opacity="0">
      <!-- Underfit regime -->
      <rect x="100" y="50" width="400" height="600" fill="url(#underfitShade)"/>
      <!-- Interpolation threshold regime -->
      <rect x="500" y="50" width="300" height="600" fill="url(#interpolationShade)"/>
      <!-- Overfit/modern regime -->
      <rect x="800" y="50" width="620" height="600" fill="url(#overfitShade)"/>
      <animate attributeName="opacity" from="0" to="1" begin="2s" dur="0.8s" fill="freeze"/>
    </g>

    <!-- Axes -->
    <g id="axes" stroke="#666666" stroke-width="3" opacity="0">
      <line x1="100" y1="650" x2="1420" y2="650"/>
      <line x1="100" y1="50" x2="100" y2="650"/>
      <!-- Arrows -->
      <path d="M 1420,650 L 1405,645 L 1405,655 Z" fill="#666666"/>
      <path d="M 100,50 L 95,65 L 105,65 Z" fill="#666666"/>
      <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.5s" fill="freeze"/>
    </g>

    <!-- X-axis labels (log scale for model complexity) -->
    <g id="xAxisLabels" opacity="0">
      <text x="100" y="680" font-family="'SF Mono', monospace" font-size="20" fill="#888888" text-anchor="middle">1</text>
      <text x="320" y="680" font-family="'SF Mono', monospace" font-size="20" fill="#888888" text-anchor="middle">10</text>
      <text x="540" y="680" font-family="'SF Mono', monospace" font-size="20" fill="#888888" text-anchor="middle">100</text>
      <text x="760" y="680" font-family="'SF Mono', monospace" font-size="20" fill="#888888" text-anchor="middle">1K</text>
      <text x="980" y="680" font-family="'SF Mono', monospace" font-size="20" fill="#888888" text-anchor="middle">10K</text>
      <text x="1200" y="680" font-family="'SF Mono', monospace" font-size="20" fill="#888888" text-anchor="middle">100K</text>
      <text x="1420" y="680" font-family="'SF Mono', monospace" font-size="20" fill="#888888" text-anchor="middle">1M</text>

      <text x="760" y="720" font-family="'SF Pro Display', sans-serif" font-size="32" fill="#EEEEEE" text-anchor="middle">
        Model Complexity (parameters)
      </text>
      <animate attributeName="opacity" from="0" to="1" begin="3s" dur="0.5s" fill="freeze"/>
    </g>

    <!-- Y-axis labels -->
    <g id="yAxisLabels" opacity="0">
      <text x="85" y="650" font-family="'SF Mono', monospace" font-size="20" fill="#888888" text-anchor="end">0.0</text>
      <text x="85" y="540" font-family="'SF Mono', monospace" font-size="20" fill="#888888" text-anchor="end">0.2</text>
      <text x="85" y="410" font-family="'SF Mono', monospace" font-size="20" fill="#888888" text-anchor="end">0.4</text>
      <text x="85" y="280" font-family="'SF Mono', monospace" font-size="20" fill="#888888" text-anchor="end">0.6</text>
      <text x="85" y="150" font-family="'SF Mono', monospace" font-size="20" fill="#888888" text-anchor="end">0.8</text>
      <text x="85" y="50" font-family="'SF Mono', monospace" font-size="20" fill="#888888" text-anchor="end">1.0</text>

      <text x="40" y="350" font-family="'SF Pro Display', sans-serif" font-size="32" fill="#EEEEEE" text-anchor="middle" transform="rotate(-90, 40, 350)">
        Test Error
      </text>
      <animate attributeName="opacity" from="0" to="1" begin="3s" dur="0.5s" fill="freeze"/>
    </g>

    <!-- Regime labels -->
    <g id="regimeLabels" opacity="0">
      <text x="300" y="35" font-family="'SF Pro Display', sans-serif" font-size="26" font-weight="bold" fill="#FC6255" text-anchor="middle">
        Underfit
      </text>
      <text x="650" y="35" font-family="'SF Pro Display', sans-serif" font-size="26" font-weight="bold" fill="#E0A856" text-anchor="middle">
        Interpolation
      </text>
      <text x="1110" y="35" font-family="'SF Pro Display', sans-serif" font-size="26" font-weight="bold" fill="#29ABCA" text-anchor="middle">
        Modern Regime
      </text>
      <animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.8s" fill="freeze"/>
    </g>

    <!-- Interpolation threshold line -->
    <g id="interpolationThreshold" opacity="0">
      <line x1="800" y1="50" x2="800" y2="650" stroke="#FFFF00" stroke-width="3" stroke-dasharray="10,5"/>
      <text x="800" y="25" font-family="'SF Pro Display', sans-serif" font-size="22" font-weight="bold" fill="#FFFF00" text-anchor="middle">
        Interpolation Threshold
      </text>
      <animate attributeName="opacity" from="0" to="1" begin="4s" dur="0.8s" fill="freeze"/>
    </g>

    <!-- Classical U-curve (dotted, gray) -->
    <path id="classicalCurve"
          d="M 100,150 Q 300,120 450,280 T 650,420 Q 750,470 850,500 T 1100,540 T 1420,560"
          fill="none" stroke="#666666" stroke-width="4" stroke-dasharray="8,6" opacity="0">
      <animate attributeName="opacity" from="0" to="0.6" begin="4.5s" dur="0.5s" fill="freeze"/>
    </path>

    <!-- Classical curve label -->
    <g id="classicalLabel" transform="translate(1300, 550)" opacity="0">
      <text x="0" y="0" font-family="'SF Pro Display', sans-serif" font-size="22" fill="#666666">
        Classical wisdom
      </text>
      <animate attributeName="opacity" from="0" to="1" begin="5s" dur="0.5s" fill="freeze"/>
    </g>

    <!-- Modern double descent curve (solid, colored) -->
    <path id="modernCurve"
          d="M 100,150 Q 300,120 450,280 T 650,420 Q 750,470 800,580 Q 850,520 950,350 T 1150,200 T 1420,120"
          fill="none" stroke="#29ABCA" stroke-width="5" filter="url(#glow)"
          stroke-dasharray="2400" stroke-dashoffset="2400" opacity="0">
      <animate attributeName="stroke-dashoffset" from="2400" to="0" begin="5.5s" dur="6s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" begin="5.5s" dur="0.5s" fill="freeze"/>
    </path>

    <!-- Surprise indicator at second descent -->
    <g id="surpriseIndicator" opacity="0">
      <circle cx="950" cy="350" r="20" fill="none" stroke="#FFFF00" stroke-width="3" filter="url(#surprise)">
        <animate attributeName="r" values="20;30;20" begin="9s" dur="1.5s" repeatCount="3"/>
      </circle>
      <text x="950" y="310" font-family="'SF Pro Display', sans-serif" font-size="28" font-weight="bold" fill="#FFFF00" text-anchor="middle">
        Surprise!
      </text>
      <text x="950" y="340" font-family="'SF Pro Display', sans-serif" font-size="22" fill="#FFFF00" text-anchor="middle">
        Second descent
      </text>
      <animate attributeName="opacity" from="0" to="1" begin="9s" dur="0.5s" fill="freeze"/>
    </g>

    <!-- Modern optimum callout -->
    <g id="modernOptimum" opacity="0">
      <circle cx="1420" cy="120" r="12" fill="#27AE60" filter="url(#strongGlow)"/>
      <path d="M 1420,120 L 1350,80" stroke="#27AE60" stroke-width="3" marker-end="none"/>
      <text x="1330" y="60" font-family="'SF Pro Display', sans-serif" font-size="26" font-weight="bold" fill="#27AE60" text-anchor="end">
        Modern Optimum
      </text>
      <text x="1330" y="85" font-family="'SF Pro Display', sans-serif" font-size="20" fill="#888888" text-anchor="end">
        (Overparameterized)
      </text>
      <animate attributeName="opacity" from="0" to="1" begin="11s" dur="0.8s" fill="freeze"/>
    </g>

    <!-- Inset plots showing model fit -->
    <g id="insetPlots">
      <!-- Small model (underfit) -->
      <g id="smallModelInset" transform="translate(150, 100)" opacity="0">
        <rect x="0" y="0" width="180" height="140" fill="#1A1A1A" stroke="#FC6255" stroke-width="2" rx="5"/>
        <text x="90" y="20" font-family="'SF Pro Display', sans-serif" font-size="18" fill="#EEEEEE" text-anchor="middle">Small NN</text>
        <!-- Simple curve that underfits -->
        <path d="M 20,120 Q 90,80 160,120" fill="none" stroke="#FC6255" stroke-width="2"/>
        <!-- Data points scattered -->
        <circle cx="30" cy="110" r="3" fill="#29ABCA"/>
        <circle cx="50" cy="70" r="3" fill="#29ABCA"/>
        <circle cx="70" cy="90" r="3" fill="#29ABCA"/>
        <circle cx="90" cy="60" r="3" fill="#29ABCA"/>
        <circle cx="110" cy="85" r="3" fill="#29ABCA"/>
        <circle cx="130" cy="75" r="3" fill="#29ABCA"/>
        <circle cx="150" cy="110" r="3" fill="#29ABCA"/>
        <text x="90" y="135" font-family="sans-serif" font-size="14" fill="#888888" text-anchor="middle">Too simple</text>
        <animate attributeName="opacity" from="0" to="1" begin="6s" dur="0.5s" fill="freeze"/>
      </g>

      <!-- Large model (good fit) -->
      <g id="largeModelInset" transform="translate(1150, 100)" opacity="0">
        <rect x="0" y="0" width="180" height="140" fill="#1A1A1A" stroke="#27AE60" stroke-width="2" rx="5"/>
        <text x="90" y="20" font-family="'SF Pro Display', sans-serif" font-size="18" fill="#EEEEEE" text-anchor="middle">Large NN</text>
        <!-- Smooth curve fitting well -->
        <path d="M 20,110 Q 40,70 60,85 T 100,65 T 140,80 Q 160,95 160,110" fill="none" stroke="#27AE60" stroke-width="2"/>
        <!-- Data points on curve -->
        <circle cx="30" cy="95" r="3" fill="#29ABCA"/>
        <circle cx="50" cy="72" r="3" fill="#29ABCA"/>
        <circle cx="70" cy="88" r="3" fill="#29ABCA"/>
        <circle cx="90" cy="70" r="3" fill="#29ABCA"/>
        <circle cx="110" cy="75" r="3" fill="#29ABCA"/>
        <circle cx="130" cy="85" r="3" fill="#29ABCA"/>
        <circle cx="150" cy="105" r="3" fill="#29ABCA"/>
        <text x="90" y="135" font-family="sans-serif" font-size="14" fill="#888888" text-anchor="middle">Just right!</text>
        <animate attributeName="opacity" from="0" to="1" begin="11.5s" dur="0.5s" fill="freeze"/>
      </g>

      <!-- Medium model at interpolation (worst) -->
      <g id="mediumModelInset" transform="translate(620, 450)" opacity="0">
        <rect x="0" y="0" width="180" height="140" fill="#1A1A1A" stroke="#E0A856" stroke-width="2" rx="5"/>
        <text x="90" y="20" font-family="'SF Pro Display', sans-serif" font-size="18" fill="#EEEEEE" text-anchor="middle">Medium NN</text>
        <!-- Wiggly overfitting curve -->
        <path d="M 20,100 Q 30,120 40,80 T 60,90 T 80,70 T 100,95 T 120,75 T 140,90 T 160,110" fill="none" stroke="#E0A856" stroke-width="2"/>
        <!-- Data points -->
        <circle cx="30" cy="95" r="3" fill="#29ABCA"/>
        <circle cx="50" cy="88" r="3" fill="#29ABCA"/>
        <circle cx="70" cy="72" r="3" fill="#29ABCA"/>
        <circle cx="90" cy="93" r="3" fill="#29ABCA"/>
        <circle cx="110" cy="77" r="3" fill="#29ABCA"/>
        <circle cx="130" cy="88" r="3" fill="#29ABCA"/>
        <circle cx="150" cy="105" r="3" fill="#29ABCA"/>
        <text x="90" y="135" font-family="sans-serif" font-size="14" fill="#888888" text-anchor="middle">Worst case</text>
        <animate attributeName="opacity" from="0" to="1" begin="8s" dur="0.5s" fill="freeze"/>
      </g>
    </g>
  </g>

  <!-- Key insight callout -->
  <g id="keyInsight" transform="translate(960, 970)" opacity="0">
    <rect x="-450" y="-60" width="900" height="90" fill="#1A1A1A" stroke="#29ABCA" stroke-width="3" rx="12"/>
    <text x="0" y="-30" font-family="'SF Pro Display', sans-serif" font-size="28" font-weight="bold" fill="#EEEEEE" text-anchor="middle">
      Key Insight: Bigger can be better
    </text>
    <text x="0" y="5" font-family="'SF Pro Display', sans-serif" font-size="24" fill="#888888" text-anchor="middle">
      Modern overparameterized models generalize well despite fitting training data perfectly
    </text>
    <animate attributeName="opacity" from="0" to="1" begin="12s" dur="1s" fill="freeze"/>
  </g>

  <!-- Legend -->
  <g id="legend" transform="translate(150, 950)" opacity="0">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#666666" stroke-width="4" stroke-dasharray="8,6"/>
    <text x="50" y="5" font-family="'SF Pro Display', sans-serif" font-size="20" fill="#EEEEEE">Classical theory</text>

    <line x1="0" y1="30" x2="40" y2="30" stroke="#29ABCA" stroke-width="5"/>
    <text x="50" y="35" font-family="'SF Pro Display', sans-serif" font-size="20" fill="#EEEEEE">Modern behavior</text>

    <animate attributeName="opacity" from="0" to="1" begin="5.5s" dur="0.5s" fill="freeze"/>
  </g>

  <!-- 3Blue1Brown style watermark -->
  <g id="watermark" opacity="0.3">
    <text x="1680" y="1070" font-family="'SF Pro Display', sans-serif" font-size="18" fill="#666666" text-anchor="end">
      3B1B-Style Double Descent Visualization
    </text>
  </g>
</svg>