<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Bias-Variance Tradeoff - 3Blue1Brown Style</title>
  <desc>Visualization showing underfit (high bias), optimal fit, and overfit (high variance) models with model complexity slider</desc>

  <defs>
    <!-- 3Blue1Brown color palette -->
    <linearGradient id="optimalGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27AE60;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#27AE60;stop-opacity:0"/>
    </linearGradient>

    <linearGradient id="trainingGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#29ABCA;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#29ABCA;stop-opacity:0.1"/>
    </linearGradient>

    <linearGradient id="validationGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FC6255;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#FC6255;stop-opacity:0.1"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#111111"/>

  <!-- Title -->
  <g id="title" opacity="0">
    <text x="960" y="70" font-family="'SF Pro Display', 'Lato', sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      Bias-Variance Tradeoff
    </text>
    <text x="960" y="115" font-family="'SF Pro Display', sans-serif" font-size="32" fill="#888888" text-anchor="middle">
      Finding the Sweet Spot Between Underfitting and Overfitting
    </text>
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.8s" fill="freeze"/>
  </g>

  <!-- Main Plot Area -->
  <g id="mainPlot" transform="translate(150, 180)">
    <rect x="0" y="0" width="900" height="550" fill="#1A1A1A" rx="10" stroke="#444444" stroke-width="2" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.5s" fill="freeze"/>
    </rect>

    <!-- Axes -->
    <line x1="60" y1="490" x2="840" y2="490" stroke="#444444" stroke-width="3" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.5s" fill="freeze"/>
    </line>
    <line x1="60" y1="60" x2="60" y2="490" stroke="#444444" stroke-width="3" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.5s" fill="freeze"/>
    </line>

    <!-- Axis labels -->
    <text x="450" y="530" font-family="sans-serif" font-size="28" fill="#EEEEEE" text-anchor="middle" opacity="0">
      Temperature (°C)
      <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.5s" fill="freeze"/>
    </text>
    <text x="30" y="275" font-family="sans-serif" font-size="28" fill="#EEEEEE" text-anchor="middle" transform="rotate(-90 30 275)" opacity="0">
      CV Risk
      <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.5s" fill="freeze"/>
    </text>

    <!-- Data points (scatter) -->
    <g id="dataPoints" opacity="0">
      <circle cx="150" cy="390" r="8" fill="#29ABCA" opacity="0.7"/>
      <circle cx="200" cy="410" r="8" fill="#29ABCA" opacity="0.7"/>
      <circle cx="250" cy="400" r="8" fill="#29ABCA" opacity="0.7"/>
      <circle cx="300" cy="350" r="8" fill="#FC6255" opacity="0.7"/>
      <circle cx="350" cy="300" r="8" fill="#FC6255" opacity="0.7"/>
      <circle cx="400" cy="250" r="8" fill="#FC6255" opacity="0.7"/>
      <circle cx="450" cy="220" r="8" fill="#FC6255" opacity="0.7"/>
      <circle cx="500" cy="200" r="8" fill="#FC6255" opacity="0.7"/>
      <circle cx="550" cy="190" r="8" fill="#FC6255" opacity="0.7"/>
      <circle cx="600" cy="210" r="8" fill="#FC6255" opacity="0.7"/>
      <circle cx="650" cy="240" r="8" fill="#FC6255" opacity="0.7"/>
      <circle cx="700" cy="280" r="8" fill="#FC6255" opacity="0.7"/>
      <circle cx="750" cy="330" r="8" fill="#29ABCA" opacity="0.7"/>
      <circle cx="800" cy="380" r="8" fill="#29ABCA" opacity="0.7"/>
      <animate attributeName="opacity" from="0" to="1" begin="2s" dur="0.8s" fill="freeze"/>
    </g>

    <!-- True underlying curve (dashed white) -->
    <path id="trueCurve" d="M 100,420 Q 300,400 450,200 T 800,360"
          fill="none" stroke="#AAAAAA" stroke-width="3" stroke-dasharray="10,5" opacity="0">
      <animate attributeName="opacity" from="0" to="0.5" begin="2.5s" dur="0.5s" fill="freeze"/>
    </path>
    <text x="820" y="365" font-family="sans-serif" font-size="18" fill="#AAAAAA" opacity="0">
      True
      <animate attributeName="opacity" from="0" to="0.5" begin="2.5s" dur="0.5s" fill="freeze"/>
    </text>

    <!-- Model 1: High Bias (Underfit) - Linear model (Red) -->
    <path id="underfitModel" d="M 100,450 L 800,250"
          fill="none" stroke="#FC6255" stroke-width="4" opacity="0" stroke-dasharray="1000" stroke-dashoffset="1000">
      <animate attributeName="stroke-dashoffset" from="1000" to="0" begin="3.5s" dur="1.5s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="0.8" begin="3.5s" dur="0.3s" fill="freeze"/>
    </path>

    <!-- Model 2: Optimal (Green, glowing) -->
    <path id="optimalModel" d="M 100,420 Q 300,400 450,200 T 800,360"
          fill="none" stroke="#27AE60" stroke-width="5" opacity="0" filter="url(#strongGlow)"
          stroke-dasharray="1000" stroke-dashoffset="1000">
      <animate attributeName="stroke-dashoffset" from="1000" to="0" begin="8s" dur="1.5s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" begin="8s" dur="0.3s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0.7;1" begin="9.5s" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- Model 3: High Variance (Overfit) - Wiggly (Blue) -->
    <path id="overfitModel" d="M 100,420 Q 150,385 200,410 T 250,395 T 300,355 T 350,295 T 400,255 T 450,215 T 500,195 T 550,185 T 600,215 T 650,245 T 700,285 T 750,325 T 800,380"
          fill="none" stroke="#29ABCA" stroke-width="4" opacity="0" stroke-dasharray="1500" stroke-dashoffset="1500">
      <animate attributeName="stroke-dashoffset" from="1500" to="0" begin="12.5s" dur="2s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="0.8" begin="12.5s" dur="0.3s" fill="freeze"/>
    </path>
  </g>

  <!-- Model complexity slider -->
  <g id="complexitySlider" transform="translate(450, 800)" opacity="0">
    <text x="0" y="-30" font-family="'SF Pro Display', sans-serif" font-size="32" fill="#EEEEEE" font-weight="bold">
      Model Complexity
    </text>

    <!-- Slider track -->
    <rect x="0" y="0" width="700" height="20" fill="#333333" rx="10"/>

    <!-- Slider fill -->
    <rect x="0" y="0" width="0" height="20" fill="#29ABCA" rx="10">
      <animate attributeName="width" values="0;100;100;350;350;700" begin="3s" dur="12s" fill="freeze"/>
    </rect>

    <!-- Slider thumb -->
    <circle cy="10" r="18" fill="#EEEEEE" stroke="#29ABCA" stroke-width="3">
      <animate attributeName="cx" values="0;100;100;350;350;700" begin="3s" dur="12s" fill="freeze"/>
    </circle>

    <!-- Labels under slider -->
    <text x="0" y="50" font-family="sans-serif" font-size="20" fill="#888888" text-anchor="start">
      Simple
    </text>
    <text x="350" y="50" font-family="sans-serif" font-size="20" fill="#888888" text-anchor="middle">
      Moderate
    </text>
    <text x="700" y="50" font-family="sans-serif" font-size="20" fill="#888888" text-anchor="end">
      Complex
    </text>

    <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.5s" fill="freeze"/>
  </g>

  <!-- Bottom panel: Error curves -->
  <g id="errorCurves" transform="translate(1150, 180)">
    <rect x="0" y="0" width="650" height="550" fill="#1A1A1A" rx="10" stroke="#444444" stroke-width="2" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.5s" fill="freeze"/>
    </rect>

    <text x="325" y="40" font-family="'SF Pro Display', sans-serif" font-size="32" font-weight="bold" fill="#EEEEEE" text-anchor="middle" opacity="0">
      Training vs Validation Error
      <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.5s" fill="freeze"/>
    </text>

    <!-- Axes -->
    <line x1="60" y1="490" x2="590" y2="490" stroke="#444444" stroke-width="3" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.5s" fill="freeze"/>
    </line>
    <line x1="60" y1="90" x2="60" y2="490" stroke="#444444" stroke-width="3" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.5s" fill="freeze"/>
    </line>

    <!-- Axis labels -->
    <text x="325" y="525" font-family="sans-serif" font-size="24" fill="#EEEEEE" text-anchor="middle" opacity="0">
      Model Complexity →
      <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.5s" fill="freeze"/>
    </text>
    <text x="30" y="290" font-family="sans-serif" font-size="24" fill="#EEEEEE" text-anchor="middle" transform="rotate(-90 30 290)" opacity="0">
      Error
      <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.5s" fill="freeze"/>
    </text>

    <!-- Training error curve (blue, decreasing) -->
    <path id="trainingError" d="M 60,120 Q 200,140 325,300 T 590,450"
          fill="none" stroke="#29ABCA" stroke-width="4" opacity="0" stroke-dasharray="800" stroke-dashoffset="800">
      <animate attributeName="stroke-dashoffset" from="800" to="0" begin="16s" dur="2s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" begin="16s" dur="0.3s" fill="freeze"/>
    </path>
    <text x="590" y="440" font-family="sans-serif" font-size="20" fill="#29ABCA" opacity="0">
      Training
      <animate attributeName="opacity" from="0" to="1" begin="17.5s" dur="0.5s" fill="freeze"/>
    </text>

    <!-- Validation error curve (red, U-shaped) -->
    <path id="validationError" d="M 60,180 Q 200,160 325,150 T 590,300"
          fill="none" stroke="#FC6255" stroke-width="4" opacity="0" stroke-dasharray="800" stroke-dashoffset="800">
      <animate attributeName="stroke-dashoffset" from="800" to="0" begin="16s" dur="2s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" begin="16s" dur="0.3s" fill="freeze"/>
    </path>
    <text x="590" y="310" font-family="sans-serif" font-size="20" fill="#FC6255" opacity="0">
      Validation
      <animate attributeName="opacity" from="0" to="1" begin="17.5s" dur="0.5s" fill="freeze"/>
    </text>

    <!-- Optimal point marker (vertical line with star) -->
    <line id="optimalLine" x1="325" y1="90" x2="325" y2="490" stroke="#FFFF00" stroke-width="3" stroke-dasharray="8,4" opacity="0">
      <animate attributeName="opacity" from="0" to="0.8" begin="18s" dur="0.5s" fill="freeze"/>
    </line>
    <circle cx="325" cy="150" r="10" fill="#FFFF00" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" from="0" to="1" begin="18s" dur="0.5s" fill="freeze"/>
      <animate attributeName="r" values="10;14;10" begin="18.5s" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="325" y="75" font-family="sans-serif" font-size="48" fill="#FFFF00" text-anchor="middle" opacity="0">
      ★
      <animate attributeName="opacity" from="0" to="1" begin="18s" dur="0.5s" fill="freeze"/>
    </text>

    <!-- Shaded regions for regimes -->
    <rect x="60" y="90" width="140" height="400" fill="#FC6255" opacity="0">
      <animate attributeName="opacity" from="0" to="0.1" begin="18.5s" dur="0.5s" fill="freeze"/>
    </rect>
    <rect x="200" y="90" width="250" height="400" fill="#27AE60" opacity="0">
      <animate attributeName="opacity" from="0" to="0.1" begin="18.5s" dur="0.5s" fill="freeze"/>
    </rect>
    <rect x="450" y="90" width="140" height="400" fill="#29ABCA" opacity="0">
      <animate attributeName="opacity" from="0" to="0.1" begin="18.5s" dur="0.5s" fill="freeze"/>
    </rect>
  </g>

  <!-- Regime annotations -->
  <g id="regimeLabels" opacity="0">
    <g id="underfitLabel" transform="translate(300, 650)">
      <rect x="0" y="0" width="180" height="80" fill="#FC6255" opacity="0.2" rx="10"/>
      <text x="90" y="30" font-family="'SF Pro Display', sans-serif" font-size="24" font-weight="bold" fill="#FC6255" text-anchor="middle">
        Too Simple
      </text>
      <text x="90" y="60" font-family="sans-serif" font-size="18" fill="#888888" text-anchor="middle">
        High Bias
      </text>
    </g>

    <g id="optimalLabel" transform="translate(570, 650)">
      <rect x="0" y="0" width="180" height="80" fill="#27AE60" opacity="0.3" rx="10" stroke="#27AE60" stroke-width="3"/>
      <text x="90" y="30" font-family="'SF Pro Display', sans-serif" font-size="24" font-weight="bold" fill="#27AE60" text-anchor="middle">
        Just Right ★
      </text>
      <text x="90" y="60" font-family="sans-serif" font-size="18" fill="#888888" text-anchor="middle">
        Balanced
      </text>
    </g>

    <g id="overfitLabel" transform="translate(840, 650)">
      <rect x="0" y="0" width="180" height="80" fill="#29ABCA" opacity="0.2" rx="10"/>
      <text x="90" y="30" font-family="'SF Pro Display', sans-serif" font-size="24" font-weight="bold" fill="#29ABCA" text-anchor="middle">
        Too Complex
      </text>
      <text x="90" y="60" font-family="sans-serif" font-size="18" fill="#888888" text-anchor="middle">
        High Variance
      </text>
    </g>

    <animate attributeName="opacity" from="0" to="1" begin="5s" dur="0.8s" fill="freeze"/>
  </g>

  <!-- Formula -->
  <g id="formula" transform="translate(450, 950)" opacity="0">
    <rect x="0" y="-50" width="750" height="90" fill="#1A1A1A" opacity="0.95" rx="10" stroke="#444444" stroke-width="2"/>
    <text x="375" y="0" font-family="'SF Pro Display', sans-serif" font-size="40" fill="#EEEEEE" text-anchor="middle">
      Total Error = <tspan fill="#FC6255">Bias²</tspan> + <tspan fill="#29ABCA">Variance</tspan> + <tspan fill="#888888">σ²</tspan>
    </text>
    <text x="375" y="30" font-family="sans-serif" font-size="20" fill="#888888" text-anchor="middle">
      Minimize the sum, not individual components
    </text>
    <animate attributeName="opacity" from="0" to="1" begin="19s" dur="0.8s" fill="freeze"/>
  </g>

  <!-- Current complexity value display -->
  <g id="complexityValue" transform="translate(800, 860)" opacity="0">
    <text x="0" y="0" font-family="'SF Mono', monospace" font-size="32" fill="#29ABCA">
      <tspan id="complexityNumber">Complexity: </tspan>
      <tspan fill="#FFFF00" font-weight="bold">
        <animate attributeName="opacity" values="1;1;1;1;1;1" begin="3s" dur="12s" fill="freeze"/>
        1
        <set attributeName="textContent" to="1" begin="3s"/>
        <set attributeName="textContent" to="5" begin="8s"/>
        <set attributeName="textContent" to="15" begin="12.5s"/>
      </tspan>
    </text>
    <animate attributeName="opacity" from="0" to="1" begin="3s" dur="0.5s" fill="freeze"/>
  </g>

  <!-- Animation state indicators -->
  <g id="stateLabels">
    <text x="650" y="160" font-family="'SF Pro Display', sans-serif" font-size="36" fill="#FC6255" text-anchor="middle" font-weight="bold" opacity="0">
      UNDERFIT
      <animate attributeName="opacity" values="0;1;1;0" begin="3.5s" dur="4s" fill="freeze"/>
    </text>
    <text x="650" y="160" font-family="'SF Pro Display', sans-serif" font-size="36" fill="#27AE60" text-anchor="middle" font-weight="bold" opacity="0">
      OPTIMAL ★
      <animate attributeName="opacity" values="0;1;1;0" begin="8s" dur="4s" fill="freeze"/>
    </text>
    <text x="650" y="160" font-family="'SF Pro Display', sans-serif" font-size="36" fill="#29ABCA" text-anchor="middle" font-weight="bold" opacity="0">
      OVERFIT
      <animate attributeName="opacity" values="0;1;1;1" begin="12.5s" dur="3s" fill="freeze"/>
    </text>
  </g>

  <!-- 3Blue1Brown watermark -->
  <g id="watermark" opacity="0.3">
    <text x="100" y="1050" font-family="'SF Pro Display', sans-serif" font-size="18" fill="#666666">
      3B1B-Style Visualization
    </text>
  </g>
</svg>