<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- 3Blue1Brown Style Decision Tree Building Animation -->
  <defs>
    <!-- Purity gradient (mixed to pure) -->
    <linearGradient id="purityGradient">
      <stop offset="0%" style="stop-color:#CF5044;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#E07856;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#29ABCA;stop-opacity:0.3"/>
    </linearGradient>

    <!-- Region color for CV admission -->
    <radialGradient id="cvRegion">
      <stop offset="0%" style="stop-color:#FC6255;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#FC6255;stop-opacity:0.1"/>
    </radialGradient>

    <!-- Region color for no admission -->
    <radialGradient id="noAdmissionRegion">
      <stop offset="0%" style="stop-color:#29ABCA;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#29ABCA;stop-opacity:0.1"/>
    </radialGradient>

    <!-- Glow for split lines -->
    <filter id="splitGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong glow -->
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#111111"/>

  <!-- Title -->
  <g id="title">
    <text x="960" y="70" font-family="'SF Pro Display', 'Lato', sans-serif" font-size="64" font-weight="bold" fill="#FFFFFF" text-anchor="middle" opacity="0">
      Decision Tree Construction
      <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.8s" fill="freeze"/>
    </text>
    <text x="960" y="115" font-family="'SF Pro Display', sans-serif" font-size="30" fill="#888888" text-anchor="middle" opacity="0">
      Finding optimal splits using Gini impurity
      <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.6s" fill="freeze"/>
    </text>
  </g>

  <!-- Main split layout: Left (scatter plot) | Right (tree structure) -->
  <g id="mainContent">
    <!-- LEFT PANEL: Scatter Plot with Data -->
    <g id="scatterPlot" transform="translate(100, 180)">
      <!-- Panel background -->
      <rect x="0" y="0" width="780" height="700" fill="#1A1A1A" stroke="#444444" stroke-width="2" rx="10" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.5s" fill="freeze"/>
      </rect>

      <!-- Axes -->
      <g id="axes" stroke="#666666" stroke-width="2" opacity="0">
        <line x1="60" y1="640" x2="720" y2="640"/>
        <line x1="60" y1="60" x2="60" y2="640"/>
        <!-- Arrow heads -->
        <path d="M 720,640 L 710,635 L 710,645 Z" fill="#666666"/>
        <path d="M 60,60 L 55,70 L 65,70 Z" fill="#666666"/>
        <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.5s" fill="freeze"/>
      </g>

      <!-- Axis labels -->
      <g id="axisLabels" opacity="0">
        <text x="390" y="680" font-family="'SF Pro Display', sans-serif" font-size="28" fill="#EEEEEE" text-anchor="middle">
          Temperature (°C)
        </text>
        <text x="20" y="350" font-family="'SF Pro Display', sans-serif" font-size="28" fill="#EEEEEE" text-anchor="middle" transform="rotate(-90, 20, 350)">
          Humidity (%)
        </text>
        <!-- Tick labels -->
        <text x="60" y="660" font-family="monospace" font-size="18" fill="#888888" text-anchor="middle">15</text>
        <text x="280" y="660" font-family="monospace" font-size="18" fill="#888888" text-anchor="middle">25</text>
        <text x="500" y="660" font-family="monospace" font-size="18" fill="#888888" text-anchor="middle">35</text>
        <text x="720" y="660" font-family="monospace" font-size="18" fill="#888888" text-anchor="middle">45</text>

        <text x="45" y="640" font-family="monospace" font-size="18" fill="#888888" text-anchor="end">20</text>
        <text x="45" y="495" font-family="monospace" font-size="18" fill="#888888" text-anchor="end">40</text>
        <text x="45" y="350" font-family="monospace" font-size="18" fill="#888888" text-anchor="end">60</text>
        <text x="45" y="205" font-family="monospace" font-size="18" fill="#888888" text-anchor="end">80</text>
        <text x="45" y="60" font-family="monospace" font-size="18" fill="#888888" text-anchor="end">100</text>

        <animate attributeName="opacity" from="0" to="1" begin="2s" dur="0.5s" fill="freeze"/>
      </g>

      <!-- Data points: Red (CV admission), Blue (no admission) -->
      <g id="dataPoints" opacity="0">
        <!-- CV admissions (Red) - high temp, high humidity -->
        <circle cx="520" cy="150" r="8" fill="#FC6255" stroke="#CF5044" stroke-width="2"/>
        <circle cx="580" cy="180" r="8" fill="#FC6255" stroke="#CF5044" stroke-width="2"/>
        <circle cx="630" cy="120" r="8" fill="#FC6255" stroke="#CF5044" stroke-width="2"/>
        <circle cx="550" cy="200" r="8" fill="#FC6255" stroke="#CF5044" stroke-width="2"/>
        <circle cx="600" cy="140" r="8" fill="#FC6255" stroke="#CF5044" stroke-width="2"/>
        <circle cx="670" cy="160" r="8" fill="#FC6255" stroke="#CF5044" stroke-width="2"/>
        <circle cx="540" cy="100" r="8" fill="#FC6255" stroke="#CF5044" stroke-width="2"/>
        <circle cx="610" cy="190" r="8" fill="#FC6255" stroke="#CF5044" stroke-width="2"/>
        <circle cx="650" cy="130" r="8" fill="#FC6255" stroke="#CF5044" stroke-width="2"/>
        <circle cx="590" cy="170" r="8" fill="#FC6255" stroke="#CF5044" stroke-width="2"/>

        <!-- No admissions (Blue) - lower temp or lower humidity -->
        <circle cx="150" cy="400" r="8" fill="#29ABCA" stroke="#1C758A" stroke-width="2"/>
        <circle cx="200" cy="450" r="8" fill="#29ABCA" stroke="#1C758A" stroke-width="2"/>
        <circle cx="180" cy="520" r="8" fill="#29ABCA" stroke="#1C758A" stroke-width="2"/>
        <circle cx="250" cy="480" r="8" fill="#29ABCA" stroke="#1C758A" stroke-width="2"/>
        <circle cx="120" cy="350" r="8" fill="#29ABCA" stroke="#1C758A" stroke-width="2"/>
        <circle cx="280" cy="500" r="8" fill="#29ABCA" stroke="#1C758A" stroke-width="2"/>
        <circle cx="160" cy="420" r="8" fill="#29ABCA" stroke="#1C758A" stroke-width="2"/>
        <circle cx="220" cy="460" r="8" fill="#29ABCA" stroke="#1C758A" stroke-width="2"/>
        <circle cx="190" cy="380" r="8" fill="#29ABCA" stroke="#1C758A" stroke-width="2"/>
        <circle cx="240" cy="440" r="8" fill="#29ABCA" stroke="#1C758A" stroke-width="2"/>

        <!-- Mixed region points -->
        <circle cx="320" cy="280" r="8" fill="#29ABCA" stroke="#1C758A" stroke-width="2"/>
        <circle cx="380" cy="320" r="8" fill="#FC6255" stroke="#CF5044" stroke-width="2"/>
        <circle cx="420" cy="260" r="8" fill="#29ABCA" stroke="#1C758A" stroke-width="2"/>
        <circle cx="360" cy="340" r="8" fill="#FC6255" stroke="#CF5044" stroke-width="2"/>

        <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="1s" fill="freeze"/>
      </g>

      <!-- Legend -->
      <g id="legend" transform="translate(600, 30)" opacity="0">
        <rect x="0" y="0" width="150" height="70" fill="#1A1A1A" stroke="#666666" stroke-width="1" rx="5"/>
        <circle cx="15" cy="20" r="6" fill="#FC6255" stroke="#CF5044" stroke-width="1.5"/>
        <text x="30" y="25" font-family="'SF Pro Display', sans-serif" font-size="18" fill="#EEEEEE">CV Admit</text>
        <circle cx="15" cy="50" r="6" fill="#29ABCA" stroke="#1C758A" stroke-width="1.5"/>
        <text x="30" y="55" font-family="'SF Pro Display', sans-serif" font-size="18" fill="#EEEEEE">No Admit</text>
        <animate attributeName="opacity" from="0" to="1" begin="3s" dur="0.5s" fill="freeze"/>
      </g>

      <!-- First split line (Temperature = 32°C) -->
      <g id="firstSplit" opacity="0">
        <line x1="456" y1="60" x2="456" y2="640" stroke="#FFFF00" stroke-width="4" stroke-dasharray="8,4" filter="url(#splitGlow)"/>
        <text x="456" y="45" font-family="'SF Pro Display', sans-serif" font-size="24" font-weight="bold" fill="#FFFF00" text-anchor="middle">
          Temp = 32°C
        </text>
        <animate attributeName="opacity" from="0" to="1" begin="4s" dur="0.8s" fill="freeze"/>
      </g>

      <!-- Gini calculation for first split -->
      <g id="giniCalc1" transform="translate(100, 30)" opacity="0">
        <rect x="0" y="0" width="380" height="90" fill="#1A1A1A" stroke="#FFFF00" stroke-width="2" rx="8"/>
        <text x="190" y="30" font-family="'SF Pro Display', sans-serif" font-size="24" fill="#EEEEEE" text-anchor="middle">
          Gini Impurity
        </text>
        <text x="190" y="60" font-family="'SF Mono', monospace" font-size="28" fill="#29ABCA" text-anchor="middle">
          G = 1 − Σp<tspan baseline-shift="sub" font-size="18">i</tspan>²
        </text>
        <text x="190" y="80" font-family="'SF Mono', monospace" font-size="22" fill="#FFFF00" text-anchor="middle">
          = 0.375
        </text>
        <animate attributeName="opacity" from="0" to="1" begin="5s" dur="0.8s" fill="freeze"/>
        <animate attributeName="opacity" from="1" to="0" begin="7s" dur="0.5s" fill="freeze"/>
      </g>

      <!-- Information gain display -->
      <g id="infoGain" transform="translate(250, 30)" opacity="0">
        <rect x="0" y="0" width="280" height="70" fill="#1A1A1A" stroke="#27AE60" stroke-width="2" rx="8"/>
        <text x="140" y="30" font-family="'SF Pro Display', sans-serif" font-size="24" fill="#EEEEEE" text-anchor="middle">
          Information Gain
        </text>
        <text x="140" y="55" font-family="'SF Mono', monospace" font-size="32" font-weight="bold" fill="#27AE60" text-anchor="middle">
          0.625
        </text>
        <animate attributeName="opacity" from="0" to="1" begin="7.5s" dur="0.8s" fill="freeze"/>
      </g>

      <!-- Region shading after split -->
      <g id="regionShading" opacity="0">
        <rect x="60" y="60" width="396" height="580" fill="url(#noAdmissionRegion)"/>
        <rect x="456" y="60" width="264" height="580" fill="url(#cvRegion)"/>
        <animate attributeName="opacity" from="0" to="0.6" begin="8.5s" dur="1s" fill="freeze"/>
      </g>

      <!-- Best split indicator -->
      <g id="bestSplit" transform="translate(456, 350)" opacity="0">
        <path d="M -30,-40 L 30,-40 L 30,-20 L 45,-20 L 0,0 L -45,-20 L -30,-20 Z" fill="#FFFF00" opacity="0.8"/>
        <animate attributeName="opacity" from="0" to="1" begin="9s" dur="0.5s" fill="freeze"/>
      </g>
    </g>

    <!-- RIGHT PANEL: Tree Structure Building -->
    <g id="treeStructure" transform="translate(1000, 180)">
      <!-- Panel background -->
      <rect x="0" y="0" width="800" height="700" fill="#1A1A1A" stroke="#444444" stroke-width="2" rx="10" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.5s" fill="freeze"/>
      </rect>

      <!-- Title -->
      <text x="400" y="40" font-family="'SF Pro Display', sans-serif" font-size="32" font-weight="bold" fill="#EEEEEE" text-anchor="middle" opacity="0">
        Decision Tree
        <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.5s" fill="freeze"/>
      </text>

      <!-- Root node -->
      <g id="rootNode" transform="translate(400, 100)">
        <rect x="-120" y="-40" width="240" height="80" fill="#1C758A" stroke="#29ABCA" stroke-width="3" rx="8" opacity="0">
          <animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.5s" fill="freeze"/>
        </rect>
        <text x="0" y="-10" font-family="'SF Pro Display', sans-serif" font-size="24" fill="#EEEEEE" text-anchor="middle" opacity="0">
          All Data
          <animate attributeName="opacity" from="0" to="1" begin="4s" dur="0.3s" fill="freeze"/>
        </text>
        <text x="0" y="15" font-family="'SF Mono', monospace" font-size="20" fill="#888888" text-anchor="middle" opacity="0">
          Gini: 0.500
          <animate attributeName="opacity" from="0" to="1" begin="4.3s" dur="0.3s" fill="freeze"/>
        </text>
        <text x="0" y="35" font-family="'SF Mono', monospace" font-size="18" fill="#888888" text-anchor="middle" opacity="0">
          n = 34
          <animate attributeName="opacity" from="0" to="1" begin="4.6s" dur="0.3s" fill="freeze"/>
        </text>
      </g>

      <!-- Split condition -->
      <g id="splitCondition" transform="translate(400, 200)" opacity="0">
        <rect x="-100" y="-25" width="200" height="50" fill="#FFFF00" opacity="0.2" rx="5"/>
        <text x="0" y="10" font-family="'SF Mono', monospace" font-size="22" font-weight="bold" fill="#FFFF00" text-anchor="middle">
          Temp ≤ 32°C?
        </text>
        <animate attributeName="opacity" from="0" to="1" begin="9.5s" dur="0.8s" fill="freeze"/>
      </g>

      <!-- Edges to children -->
      <g id="treeEdges" stroke="#666666" stroke-width="3" opacity="0">
        <line x1="400" y1="180" x2="200" y2="280"/>
        <line x1="400" y1="180" x2="600" y2="280"/>
        <animate attributeName="opacity" from="0" to="1" begin="10s" dur="0.5s" fill="freeze"/>
      </g>

      <!-- Edge labels -->
      <g id="edgeLabels" opacity="0">
        <text x="280" y="230" font-family="'SF Pro Display', sans-serif" font-size="20" fill="#27AE60">True</text>
        <text x="520" y="230" font-family="'SF Pro Display', sans-serif" font-size="20" fill="#FC6255">False</text>
        <animate attributeName="opacity" from="0" to="1" begin="10.5s" dur="0.5s" fill="freeze"/>
      </g>

      <!-- Left child (No admission - pure) -->
      <g id="leftChild" transform="translate(200, 320)">
        <rect x="-110" y="-40" width="220" height="80" fill="#1C758A" stroke="#29ABCA" stroke-width="3" rx="8" opacity="0">
          <animate attributeName="opacity" from="0" to="1" begin="11s" dur="0.5s" fill="freeze"/>
        </rect>
        <text x="0" y="-10" font-family="'SF Pro Display', sans-serif" font-size="22" fill="#29ABCA" text-anchor="middle" opacity="0">
          No Admit
          <animate attributeName="opacity" from="0" to="1" begin="11.5s" dur="0.3s" fill="freeze"/>
        </text>
        <text x="0" y="15" font-family="'SF Mono', monospace" font-size="19" fill="#888888" text-anchor="middle" opacity="0">
          Gini: 0.180
          <animate attributeName="opacity" from="0" to="1" begin="11.8s" dur="0.3s" fill="freeze"/>
        </text>
        <text x="0" y="35" font-family="'SF Mono', monospace" font-size="17" fill="#888888" text-anchor="middle" opacity="0">
          n = 18 (pure)
          <animate attributeName="opacity" from="0" to="1" begin="12.1s" dur="0.3s" fill="freeze"/>
        </text>
      </g>

      <!-- Right child (CV admission - pure) -->
      <g id="rightChild" transform="translate(600, 320)">
        <rect x="-110" y="-40" width="220" height="80" fill="#A13433" stroke="#FC6255" stroke-width="3" rx="8" opacity="0">
          <animate attributeName="opacity" from="0" to="1" begin="11s" dur="0.5s" fill="freeze"/>
        </rect>
        <text x="0" y="-10" font-family="'SF Pro Display', sans-serif" font-size="22" fill="#FC6255" text-anchor="middle" opacity="0">
          CV Admit
          <animate attributeName="opacity" from="0" to="1" begin="11.5s" dur="0.3s" fill="freeze"/>
        </text>
        <text x="0" y="15" font-family="'SF Mono', monospace" font-size="19" fill="#888888" text-anchor="middle" opacity="0">
          Gini: 0.123
          <animate attributeName="opacity" from="0" to="1" begin="11.8s" dur="0.3s" fill="freeze"/>
        </text>
        <text x="0" y="35" font-family="'SF Mono', monospace" font-size="17" fill="#888888" text-anchor="middle" opacity="0">
          n = 16 (pure)
          <animate attributeName="opacity" from="0" to="1" begin="12.1s" dur="0.3s" fill="freeze"/>
        </text>
      </g>

      <!-- Purity indicators -->
      <g id="purityIndicators" opacity="0">
        <circle cx="200" cy="420" r="15" fill="#27AE60" filter="url(#strongGlow)"/>
        <text x="200" y="450" font-family="'SF Pro Display', sans-serif" font-size="18" fill="#27AE60" text-anchor="middle">High Purity</text>

        <circle cx="600" cy="420" r="15" fill="#27AE60" filter="url(#strongGlow)"/>
        <text x="600" y="450" font-family="'SF Pro Display', sans-serif" font-size="18" fill="#27AE60" text-anchor="middle">High Purity</text>

        <animate attributeName="opacity" from="0" to="1" begin="12.5s" dur="0.5s" fill="freeze"/>
      </g>

      <!-- Tree quality metrics -->
      <g id="treeMetrics" transform="translate(400, 550)" opacity="0">
        <rect x="-250" y="0" width="500" height="100" fill="#1A1A1A" stroke="#27AE60" stroke-width="2" rx="8"/>
        <text x="0" y="35" font-family="'SF Pro Display', sans-serif" font-size="28" fill="#EEEEEE" text-anchor="middle">
          Tree Accuracy
        </text>
        <text x="0" y="70" font-family="'SF Mono', monospace" font-size="36" font-weight="bold" fill="#27AE60" text-anchor="middle">
          94.1%
        </text>
        <animate attributeName="opacity" from="0" to="1" begin="13s" dur="0.8s" fill="freeze"/>
      </g>
    </g>
  </g>

  <!-- Formula display -->
  <g id="formula" transform="translate(960, 980)" opacity="0">
    <text x="0" y="0" font-family="'SF Pro Display', sans-serif" font-size="36" fill="#EEEEEE" text-anchor="middle">
      Gini Impurity: <tspan font-family="'SF Mono', monospace" fill="#29ABCA">G = 1 − Σ</tspan><tspan baseline-shift="sub" font-size="24">i=1</tspan><tspan baseline-shift="super" font-size="24">C</tspan> <tspan font-family="'SF Mono', monospace" fill="#29ABCA">p</tspan><tspan baseline-shift="sub" font-size="24">i</tspan><tspan baseline-shift="super" font-size="24">2</tspan>
    </text>
    <animate attributeName="opacity" from="0" to="1" begin="5s" dur="0.8s" fill="freeze"/>
  </g>

  <!-- 3Blue1Brown style watermark -->
  <g id="watermark" opacity="0.3">
    <text x="100" y="1050" font-family="'SF Pro Display', sans-serif" font-size="18" fill="#666666">
      3B1B-Style Decision Tree Visualization
    </text>
  </g>
</svg>