<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1920 1080" width="1920" height="1080">

  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="1"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="surfaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:0.8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#1a1a2e"/>

  <!-- Title -->
  <g id="title">
    <text x="960" y="55" font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="42" font-weight="300" fill="#ECF0F1" text-anchor="middle">
      Learning Rate Effect: Too Small, Just Right, Too Large
    </text>
    <text x="960" y="90" font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="18" font-weight="300" fill="#95A5A6" text-anchor="middle">
      θ_new = θ_old - α · ∇L(θ) where α is the learning rate
    </text>
  </g>

  <!-- Three parallel panels showing different learning rates -->

  <!-- Panel 1: Learning Rate TOO SMALL (α = 0.001) -->
  <g id="panel-too-small" transform="translate(100, 160)">
    <rect x="0" y="0" width="500" height="800" rx="10"
          fill="#2C3E50" opacity="0.3" stroke="#F39C12" stroke-width="3"/>

    <text x="250" y="35" font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="22" fill="#F39C12" text-anchor="middle" font-weight="600">
      α = 0.001 (Too Small)
    </text>

    <!-- Loss surface (simplified 2D view) -->
    <g transform="translate(50, 80)">
      <rect x="0" y="0" width="400" height="350" fill="#1a1a2e" opacity="0.7"
            stroke="#ECF0F1" stroke-width="1"/>

      <!-- Contour lines -->
      <ellipse cx="200" cy="280" rx="180" ry="120" fill="none" stroke="#E74C3C"
               stroke-width="1" opacity="0.3"/>
      <ellipse cx="200" cy="280" rx="140" ry="90" fill="none" stroke="#E67E22"
               stroke-width="1" opacity="0.4"/>
      <ellipse cx="200" cy="280" rx="100" ry="60" fill="none" stroke="#F39C12"
               stroke-width="1" opacity="0.5"/>
      <ellipse cx="200" cy="280" rx="60" ry="40" fill="none" stroke="#F1C40F"
               stroke-width="1" opacity="0.6"/>
      <ellipse cx="200" cy="280" rx="30" ry="20" fill="none" stroke="#52C77B"
               stroke-width="1" opacity="0.7"/>

      <!-- Minimum point -->
      <circle cx="200" cy="280" r="6" fill="#27AE60" opacity="0.8"/>

      <!-- Descent path - very tiny steps -->
      <path id="path-small" fill="none" stroke="#F39C12" stroke-width="3"
            stroke-linecap="round" opacity="0">
        <animate attributeName="d"
                 values="M 350,80 L 345,95 L 340,110 L 335,125 L 330,140 L 325,155 L 320,170 L 315,185 L 310,200 L 305,213 L 300,226 L 295,238 L 290,249 L 285,259 L 280,268 L 275,276 L 270,282 L 265,287 L 260,291 L 255,294 L 250,296 L 245,297 L 240,297 L 235,296 L 230,294 L 225,291 L 220,288 L 215,285 L 210,282 L 205,280 L 200,280;
                         M 350,80 L 345,95 L 340,110 L 335,125 L 330,140 L 325,155 L 320,170 L 315,185 L 310,200 L 305,213 L 300,226 L 295,238 L 290,249 L 285,259 L 280,268 L 275,276 L 270,282 L 265,287 L 260,291 L 255,294 L 250,296 L 245,297 L 240,297 L 235,296 L 230,294 L 225,291 L 220,288 L 215,285 L 210,282 L 205,280 L 200,280"
                 dur="15s"
                 repeatCount="indefinite"/>

        <animate attributeName="opacity"
                 values="0;0.8;0.8"
                 keyTimes="0;0.05;1"
                 dur="15s"
                 repeatCount="indefinite"/>
      </path>

      <!-- Current position ball -->
      <circle r="10" fill="#F39C12" filter="url(#glow)">
        <animate attributeName="cx"
                 values="350;345;340;335;330;325;320;315;310;305;300;295;290;285;280;275;270;265;260;255;250;245;240;235;230;225;220;215;210;205;200;200;350"
                 keyTimes="0;0.03;0.06;0.09;0.12;0.15;0.18;0.21;0.24;0.27;0.3;0.33;0.36;0.39;0.42;0.45;0.48;0.51;0.54;0.57;0.6;0.63;0.66;0.69;0.72;0.75;0.78;0.81;0.84;0.87;0.9;0.95;1"
                 dur="15s"
                 repeatCount="indefinite"/>

        <animate attributeName="cy"
                 values="80;95;110;125;140;155;170;185;200;213;226;238;249;259;268;276;282;287;291;294;296;297;297;296;294;291;288;285;282;280;280;280;80"
                 keyTimes="0;0.03;0.06;0.09;0.12;0.15;0.18;0.21;0.24;0.27;0.3;0.33;0.36;0.39;0.42;0.45;0.48;0.51;0.54;0.57;0.6;0.63;0.66;0.69;0.72;0.75;0.78;0.81;0.84;0.87;0.9;0.95;1"
                 dur="15s"
                 repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Loss over time graph -->
    <g transform="translate(50, 480)">
      <rect x="0" y="0" width="400" height="200" fill="#1a1a2e" opacity="0.7"
            stroke="#ECF0F1" stroke-width="1"/>

      <text x="200" y="20" font-family="'Helvetica Neue', Arial, sans-serif"
            font-size="14" fill="#95A5A6" text-anchor="middle">
        Loss vs. Iteration
      </text>

      <!-- Axes -->
      <line x1="30" y1="170" x2="370" y2="170" stroke="#ECF0F1" stroke-width="1"/>
      <line x1="30" y1="40" x2="30" y2="170" stroke="#ECF0F1" stroke-width="1"/>

      <!-- Very slow decay curve -->
      <path d="M 30,50 Q 100,60 200,100 T 370,150"
            fill="none" stroke="#F39C12" stroke-width="3" stroke-linecap="round">
        <animate attributeName="stroke-dasharray"
                 values="0,800;800,0"
                 dur="15s"
                 repeatCount="indefinite"/>
      </path>

      <!-- Current point -->
      <circle r="6" fill="#F39C12" filter="url(#glow)">
        <animate attributeName="cx"
                 values="30;100;200;370;370;30"
                 keyTimes="0;0.3;0.6;0.9;0.95;1"
                 dur="15s"
                 repeatCount="indefinite"/>
        <animate attributeName="cy"
                 values="50;60;100;150;150;50"
                 keyTimes="0;0.3;0.6;0.9;0.95;1"
                 dur="15s"
                 repeatCount="indefinite"/>
      </circle>

      <text x="200" y="195" font-family="'Helvetica Neue', Arial, sans-serif"
            font-size="12" fill="#95A5A6" text-anchor="middle">
        Iterations
      </text>
    </g>

    <!-- Status message -->
    <g transform="translate(50, 710)">
      <rect x="0" y="0" width="400" height="60" rx="6" fill="#E67E22" opacity="0.9"/>
      <text x="200" y="25" font-family="'Helvetica Neue', Arial, sans-serif"
            font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="600">
        ⚠ Too Slow!
      </text>
      <text x="200" y="45" font-family="'Helvetica Neue', Arial, sans-serif"
            font-size="13" fill="#ECF0F1" text-anchor="middle">
        Takes forever to converge
      </text>
    </g>
  </g>

  <!-- Panel 2: Learning Rate JUST RIGHT (α = 0.1) -->
  <g id="panel-optimal" transform="translate(710, 160)">
    <rect x="0" y="0" width="500" height="800" rx="10"
          fill="#2C3E50" opacity="0.3" stroke="#27AE60" stroke-width="3"/>

    <text x="250" y="35" font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="22" fill="#27AE60" text-anchor="middle" font-weight="600">
      α = 0.1 (Just Right)
    </text>

    <g transform="translate(50, 80)">
      <rect x="0" y="0" width="400" height="350" fill="#1a1a2e" opacity="0.7"
            stroke="#ECF0F1" stroke-width="1"/>

      <!-- Contour lines -->
      <ellipse cx="200" cy="280" rx="180" ry="120" fill="none" stroke="#E74C3C"
               stroke-width="1" opacity="0.3"/>
      <ellipse cx="200" cy="280" rx="140" ry="90" fill="none" stroke="#E67E22"
               stroke-width="1" opacity="0.4"/>
      <ellipse cx="200" cy="280" rx="100" ry="60" fill="none" stroke="#F39C12"
               stroke-width="1" opacity="0.5"/>
      <ellipse cx="200" cy="280" rx="60" ry="40" fill="none" stroke="#F1C40F"
               stroke-width="1" opacity="0.6"/>
      <ellipse cx="200" cy="280" rx="30" ry="20" fill="none" stroke="#52C77B"
               stroke-width="1" opacity="0.7"/>

      <!-- Minimum point -->
      <circle cx="200" cy="280" r="6" fill="#27AE60" opacity="0.8"/>

      <!-- Optimal descent path - smooth, efficient -->
      <path id="path-optimal" fill="none" stroke="#27AE60" stroke-width="3"
            stroke-linecap="round" opacity="0">
        <animate attributeName="d"
                 values="M 350,80 L 310,130 L 270,180 L 240,220 L 220,250 L 208,268 L 202,276 L 200,280;
                         M 350,80 L 310,130 L 270,180 L 240,220 L 220,250 L 208,268 L 202,276 L 200,280"
                 dur="15s"
                 repeatCount="indefinite"/>

        <animate attributeName="opacity"
                 values="0;0.8;0.8"
                 keyTimes="0;0.05;1"
                 dur="15s"
                 repeatCount="indefinite"/>
      </path>

      <!-- Current position ball -->
      <circle r="10" fill="#27AE60" filter="url(#glow)">
        <animate attributeName="cx"
                 values="350;310;270;240;220;208;202;200;200;350"
                 keyTimes="0;0.12;0.24;0.36;0.48;0.6;0.72;0.84;0.95;1"
                 dur="15s"
                 repeatCount="indefinite"/>

        <animate attributeName="cy"
                 values="80;130;180;220;250;268;276;280;280;80"
                 keyTimes="0;0.12;0.24;0.36;0.48;0.6;0.72;0.84;0.95;1"
                 dur="15s"
                 repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Loss over time graph -->
    <g transform="translate(50, 480)">
      <rect x="0" y="0" width="400" height="200" fill="#1a1a2e" opacity="0.7"
            stroke="#ECF0F1" stroke-width="1"/>

      <text x="200" y="20" font-family="'Helvetica Neue', Arial, sans-serif"
            font-size="14" fill="#95A5A6" text-anchor="middle">
        Loss vs. Iteration
      </text>

      <!-- Axes -->
      <line x1="30" y1="170" x2="370" y2="170" stroke="#ECF0F1" stroke-width="1"/>
      <line x1="30" y1="40" x2="30" y2="170" stroke="#ECF0F1" stroke-width="1"/>

      <!-- Optimal decay curve - smooth exponential -->
      <path d="M 30,50 Q 100,85 150,120 T 250,160 Q 310,168 370,169"
            fill="none" stroke="#27AE60" stroke-width="3" stroke-linecap="round">
        <animate attributeName="stroke-dasharray"
                 values="0,800;800,0"
                 dur="15s"
                 repeatCount="indefinite"/>
      </path>

      <!-- Current point -->
      <circle r="6" fill="#27AE60" filter="url(#glow)">
        <animate attributeName="cx"
                 values="30;150;250;370;370;30"
                 keyTimes="0;0.3;0.6;0.84;0.95;1"
                 dur="15s"
                 repeatCount="indefinite"/>
        <animate attributeName="cy"
                 values="50;120;160;169;169;50"
                 keyTimes="0;0.3;0.6;0.84;0.95;1"
                 dur="15s"
                 repeatCount="indefinite"/>
      </circle>

      <text x="200" y="195" font-family="'Helvetica Neue', Arial, sans-serif"
            font-size="12" fill="#95A5A6" text-anchor="middle">
        Iterations
      </text>
    </g>

    <!-- Status message -->
    <g transform="translate(50, 710)">
      <rect x="0" y="0" width="400" height="60" rx="6" fill="#27AE60" opacity="0.9"/>
      <text x="200" y="25" font-family="'Helvetica Neue', Arial, sans-serif"
            font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="600">
        ✓ Perfect!
      </text>
      <text x="200" y="45" font-family="'Helvetica Neue', Arial, sans-serif"
            font-size="13" fill="#ECF0F1" text-anchor="middle">
        Smooth, efficient convergence
      </text>
    </g>
  </g>

  <!-- Panel 3: Learning Rate TOO LARGE (α = 0.8) -->
  <g id="panel-too-large" transform="translate(1320, 160)">
    <rect x="0" y="0" width="500" height="800" rx="10"
          fill="#2C3E50" opacity="0.3" stroke="#E74C3C" stroke-width="3"/>

    <text x="250" y="35" font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="22" fill="#E74C3C" text-anchor="middle" font-weight="600">
      α = 0.8 (Too Large)
    </text>

    <g transform="translate(50, 80)">
      <rect x="0" y="0" width="400" height="350" fill="#1a1a2e" opacity="0.7"
            stroke="#ECF0F1" stroke-width="1"/>

      <!-- Contour lines -->
      <ellipse cx="200" cy="280" rx="180" ry="120" fill="none" stroke="#E74C3C"
               stroke-width="1" opacity="0.3"/>
      <ellipse cx="200" cy="280" rx="140" ry="90" fill="none" stroke="#E67E22"
               stroke-width="1" opacity="0.4"/>
      <ellipse cx="200" cy="280" rx="100" ry="60" fill="none" stroke="#F39C12"
               stroke-width="1" opacity="0.5"/>
      <ellipse cx="200" cy="280" rx="60" ry="40" fill="none" stroke="#F1C40F"
               stroke-width="1" opacity="0.6"/>
      <ellipse cx="200" cy="280" rx="30" ry="20" fill="none" stroke="#52C77B"
               stroke-width="1" opacity="0.7"/>

      <!-- Minimum point -->
      <circle cx="200" cy="280" r="6" fill="#27AE60" opacity="0.8"/>

      <!-- Oscillating/diverging path - overshoots -->
      <path id="path-large" fill="none" stroke="#E74C3C" stroke-width="3"
            stroke-linecap="round" opacity="0">
        <animate attributeName="d"
                 values="M 350,80 L 100,320 L 320,100 L 90,310 L 310,110 L 110,300 L 290,130 L 130,285 L 270,150 L 150,275 L 250,170;
                         M 350,80 L 100,320 L 320,100 L 90,310 L 310,110 L 110,300 L 290,130 L 130,285 L 270,150 L 150,275 L 250,170"
                 dur="15s"
                 repeatCount="indefinite"/>

        <animate attributeName="opacity"
                 values="0;0.8;0.8"
                 keyTimes="0;0.05;1"
                 dur="15s"
                 repeatCount="indefinite"/>
      </path>

      <!-- Current position ball - bouncing around -->
      <circle r="10" fill="#E74C3C" filter="url(#glow)">
        <animate attributeName="cx"
                 values="350;100;320;90;310;110;290;130;270;150;250;200;350"
                 keyTimes="0;0.08;0.16;0.24;0.32;0.4;0.48;0.56;0.64;0.72;0.8;0.9;1"
                 dur="15s"
                 repeatCount="indefinite"/>

        <animate attributeName="cy"
                 values="80;320;100;310;110;300;130;285;150;275;170;280;80"
                 keyTimes="0;0.08;0.16;0.24;0.32;0.4;0.48;0.56;0.64;0.72;0.8;0.9;1"
                 dur="15s"
                 repeatCount="indefinite"/>
      </circle>

      <!-- Warning indicators for divergence -->
      <text x="350" y="40" font-family="'Helvetica Neue', Arial, sans-serif"
            font-size="24" fill="#E74C3C" opacity="0">
        ⚠
        <animate attributeName="opacity"
                 values="0;0;1;0;1;0;1;0;0"
                 keyTimes="0;0.1;0.15;0.2;0.25;0.3;0.35;0.4;1"
                 dur="15s"
                 repeatCount="indefinite"/>
      </text>
    </g>

    <!-- Loss over time graph -->
    <g transform="translate(50, 480)">
      <rect x="0" y="0" width="400" height="200" fill="#1a1a2e" opacity="0.7"
            stroke="#ECF0F1" stroke-width="1"/>

      <text x="200" y="20" font-family="'Helvetica Neue', Arial, sans-serif"
            font-size="14" fill="#95A5A6" text-anchor="middle">
        Loss vs. Iteration
      </text>

      <!-- Axes -->
      <line x1="30" y1="170" x2="370" y2="170" stroke="#ECF0F1" stroke-width="1"/>
      <line x1="30" y1="40" x2="30" y2="170" stroke="#ECF0F1" stroke-width="1"/>

      <!-- Oscillating/diverging curve -->
      <path d="M 30,100 L 60,50 L 90,120 L 120,60 L 150,130 L 180,70 L 210,135 L 240,80 L 270,140 L 300,90 L 330,145 L 370,100"
            fill="none" stroke="#E74C3C" stroke-width="3" stroke-linecap="round">
        <animate attributeName="stroke-dasharray"
                 values="0,800;800,0"
                 dur="15s"
                 repeatCount="indefinite"/>
      </path>

      <!-- Current point -->
      <circle r="6" fill="#E74C3C" filter="url(#glow)">
        <animate attributeName="cx"
                 values="30;60;90;120;150;180;210;240;270;300;330;370;30"
                 keyTimes="0;0.08;0.16;0.24;0.32;0.4;0.48;0.56;0.64;0.72;0.8;0.9;1"
                 dur="15s"
                 repeatCount="indefinite"/>
        <animate attributeName="cy"
                 values="100;50;120;60;130;70;135;80;140;90;145;100;100"
                 keyTimes="0;0.08;0.16;0.24;0.32;0.4;0.48;0.56;0.64;0.72;0.8;0.9;1"
                 dur="15s"
                 repeatCount="indefinite"/>
      </circle>

      <text x="200" y="195" font-family="'Helvetica Neue', Arial, sans-serif"
            font-size="12" fill="#95A5A6" text-anchor="middle">
        Iterations
      </text>
    </g>

    <!-- Status message -->
    <g transform="translate(50, 710)">
      <rect x="0" y="0" width="400" height="60" rx="6" fill="#C0392B" opacity="0.9"/>
      <text x="200" y="25" font-family="'Helvetica Neue', Arial, sans-serif"
            font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="600">
        ✗ Diverging!
      </text>
      <text x="200" y="45" font-family="'Helvetica Neue', Arial, sans-serif"
            font-size="13" fill="#ECF0F1" text-anchor="middle">
        Oscillates, may never converge
      </text>
    </g>
  </g>

  <!-- Bottom teaching moment -->
  <g id="teaching-moment" transform="translate(200, 1000)">
    <rect x="0" y="0" width="1520" height="60" rx="10" fill="#34495E" opacity="0.95"/>

    <text x="760" y="25" font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="20" fill="#F39C12" text-anchor="middle" font-weight="500">
      Learning Rate is Critical: Too Small → Slow | Optimal → Efficient | Too Large → Unstable
    </text>

    <text x="760" y="48" font-family="'Courier New', monospace"
          font-size="14" fill="#ECF0F1" text-anchor="middle">
      Use adaptive methods (Adam, RMSprop) or learning rate schedules for best results
    </text>
  </g>

</svg>
