<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1920 1080"
     width="1920"
     height="1080">

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');

      .title {
        font-family: 'Inter', sans-serif;
        font-size: 96px;
        font-weight: 700;
        fill: #1a1a1a;
        letter-spacing: -0.02em;
      }
      .subtitle {
        font-family: 'Inter', sans-serif;
        font-size: 48px;
        font-weight: 400;
        fill: #424242;
      }
      .date {
        font-family: 'Inter', sans-serif;
        font-size: 32px;
        font-weight: 400;
        fill: #666666;
      }
      .accent { fill: #2c5cda; }
      .branding-text {
        font-family: 'Inter', sans-serif;
        font-size: 24px;
        font-weight: 500;
        fill: #2c5cda;
      }
    </style>
  </defs>

  <!-- Background -->
  <g id="background">
    <rect width="1920" height="1080" fill="#ffffff"/>

    <!-- Subtle accent gradient bar -->
    <defs>
      <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#2c5cda;stop-opacity:0.1" />
        <stop offset="100%" style="stop-color:#00bec5;stop-opacity:0.1" />
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="1920" height="12" fill="url(#accent-gradient)"/>
  </g>

  <!-- Content -->
  <g id="content">
    <!-- Main Title -->
    <text x="960" y="440" class="title" text-anchor="middle">
      Your Presentation Title
    </text>

    <!-- Subtitle -->
    <text x="960" y="540" class="subtitle" text-anchor="middle">
      Subtitle or Key Theme
    </text>

    <!-- Date/Context -->
    <text x="960" y="620" class="date" text-anchor="middle">
      Date | Location | Event
    </text>

    <!-- Decorative accent -->
    <line x1="760" y1="480" x2="1160" y2="480"
          stroke="#2c5cda"
          stroke-width="3"
          opacity="0.3"/>
  </g>

  <!-- Branding -->
  <g id="branding">
    <!-- Logo placeholder -->
    <rect x="1640" y="940" width="200" height="80" fill="#f4f4f4" rx="8"/>
    <text x="1740" y="990" class="branding-text" text-anchor="middle">
      Wits PHR
    </text>
  </g>

</svg>
