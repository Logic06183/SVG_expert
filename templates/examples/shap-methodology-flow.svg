<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1920 1080"
     width="1920"
     height="1080">

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');

      .slide-title {
        font-family: 'Inter', sans-serif;
        font-size: 64px;
        font-weight: 700;
        fill: #2c5cda;
        letter-spacing: -0.02em;
      }
      .subtitle {
        font-family: 'Inter', sans-serif;
        font-size: 28px;
        font-weight: 400;
        fill: #666666;
      }
      .step-number {
        font-family: 'Inter', sans-serif;
        font-size: 48px;
        font-weight: 700;
        fill: #ffffff;
      }
      .step-title {
        font-family: 'Inter', sans-serif;
        font-size: 32px;
        font-weight: 700;
        fill: #1a1a1a;
      }
      .step-text {
        font-family: 'Inter', sans-serif;
        font-size: 20px;
        font-weight: 400;
        fill: #424242;
      }
      .note-text {
        font-family: 'Inter', sans-serif;
        font-size: 16px;
        font-weight: 500;
        fill: #666666;
        font-style: italic;
      }
      .branding-text {
        font-family: 'Inter', sans-serif;
        font-size: 18px;
        font-weight: 400;
        fill: #666666;
      }
    </style>

    <linearGradient id="step1-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c5cda;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5c9ed4;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="step2-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00bec5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#20a3fc;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="step3-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d68910;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f39c12;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="step4-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#cc1a1b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:1" />
    </linearGradient>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2c5cda" />
    </marker>
  </defs>

  <!-- Background -->
  <g id="background">
    <rect width="1920" height="1080" fill="#ffffff"/>
    <rect x="0" y="0" width="1920" height="6" fill="url(#step1-gradient)"/>
  </g>

  <!-- Title -->
  <g id="title">
    <text x="960" y="90" class="slide-title" text-anchor="middle">
      SHAP Analysis Methodology
    </text>
    <text x="960" y="135" class="subtitle" text-anchor="middle">
      From Data Collection to Interpretable Predictions
    </text>
  </g>

  <!-- Step 1: Data Collection -->
  <g id="step1" transform="translate(200, 220)">
    <rect x="0" y="0" width="320" height="300" fill="#ffffff" stroke="#2c5cda" stroke-width="3" rx="12"/>

    <!-- Number badge -->
    <circle cx="160" cy="-30" r="40" fill="url(#step1-gradient)"/>
    <text x="160" y="-15" class="step-number" text-anchor="middle">1</text>

    <!-- Content -->
    <text x="160" y="50" class="step-title" text-anchor="middle">Data Collection</text>

    <text x="160" y="100" class="step-text" text-anchor="middle">
      <tspan x="160" dy="0">7,493 participants</tspan>
      <tspan x="160" dy="30">Nationally representative</tspan>
      <tspan x="160" dy="30">sample</tspan>
    </text>

    <rect x="20" y="180" width="280" height="90" fill="#e3ecfc" rx="6"/>
    <text x="160" y="210" class="note-text" text-anchor="middle">
      <tspan x="160" dy="0">Heavy metal exposures</tspan>
      <tspan x="160" dy="22">(Cd, Pb, etc.)</tspan>
      <tspan x="160" dy="22">+ Health outcomes</tspan>
    </text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="550" y1="370" x2="750" y2="370" stroke="#2c5cda" stroke-width="4" marker-end="url(#arrowhead)"/>

  <!-- Step 2: Model Training -->
  <g id="step2" transform="translate(770, 220)">
    <rect x="0" y="0" width="320" height="300" fill="#ffffff" stroke="#00bec5" stroke-width="3" rx="12"/>

    <!-- Number badge -->
    <circle cx="160" cy="-30" r="40" fill="url(#step2-gradient)"/>
    <text x="160" y="-15" class="step-number" text-anchor="middle">2</text>

    <!-- Content -->
    <text x="160" y="50" class="step-title" text-anchor="middle">Model Training</text>

    <text x="160" y="100" class="step-text" text-anchor="middle">
      <tspan x="160" dy="0">CatBoost algorithm</tspan>
      <tspan x="160" dy="30">Predicts chronic</tspan>
      <tspan x="160" dy="30">bronchitis risk</tspan>
    </text>

    <rect x="20" y="180" width="280" height="90" fill="#d4f4f4" rx="6"/>
    <text x="160" y="210" class="note-text" text-anchor="middle">
      <tspan x="160" dy="0">Handles mixed data types</tspan>
      <tspan x="160" dy="22">High accuracy on</tspan>
      <tspan x="160" dy="22">complex relationships</tspan>
    </text>
  </g>

  <!-- Arrow 2 to 3 -->
  <line x1="1120" y1="370" x2="1320" y2="370" stroke="#2c5cda" stroke-width="4" marker-end="url(#arrowhead)"/>

  <!-- Step 3: SHAP Analysis -->
  <g id="step3" transform="translate(1340, 220)">
    <rect x="0" y="0" width="320" height="300" fill="#ffffff" stroke="#d68910" stroke-width="3" rx="12"/>

    <!-- Number badge -->
    <circle cx="160" cy="-30" r="40" fill="url(#step3-gradient)"/>
    <text x="160" y="-15" class="step-number" text-anchor="middle">3</text>

    <!-- Content -->
    <text x="160" y="50" class="step-title" text-anchor="middle">SHAP Analysis</text>

    <text x="160" y="100" class="step-text" text-anchor="middle">
      <tspan x="160" dy="0">Feature importance</tspan>
      <tspan x="160" dy="30">decomposition</tspan>
    </text>

    <rect x="20" y="170" width="280" height="105" fill="#fdeaa8" rx="6"/>
    <text x="160" y="200" class="note-text" text-anchor="middle">
      <tspan x="160" dy="0">Identifies key predictors:</tspan>
      <tspan x="160" dy="22">• Blood-Cd (strongest)</tspan>
      <tspan x="160" dy="22">• Smoking status</tspan>
      <tspan x="160" dy="22">• Gender</tspan>
    </text>
  </g>

  <!-- Step 4: Interpretation -->
  <g id="step4" transform="translate(770, 630)">
    <rect x="0" y="0" width="320" height="280" fill="#ffffff" stroke="#cc1a1b" stroke-width="3" rx="12"/>

    <!-- Number badge -->
    <circle cx="160" cy="-30" r="40" fill="url(#step4-gradient)"/>
    <text x="160" y="-15" class="step-number" text-anchor="middle">4</text>

    <!-- Content -->
    <text x="160" y="50" class="step-title" text-anchor="middle">Interpretation</text>

    <text x="160" y="100" class="step-text" text-anchor="middle">
      <tspan x="160" dy="0">Non-linear</tspan>
      <tspan x="160" dy="30">dose-response curves</tspan>
    </text>

    <rect x="20" y="160" width="280" height="95" fill="#fde4cd" rx="6"/>
    <text x="160" y="190" class="note-text" text-anchor="middle">
      <tspan x="160" dy="0">SHAP dependence plots</tspan>
      <tspan x="160" dy="22">reveal thresholds &amp;</tspan>
      <tspan x="160" dy="22">interaction effects</tspan>
    </text>
  </g>

  <!-- Arrow 3 to 4 -->
  <line x1="1500" y1="550" x2="1500" y2="580" stroke="#2c5cda" stroke-width="4"/>
  <line x1="1500" y1="580" x2="1120" y2="580" stroke="#2c5cda" stroke-width="4"/>
  <line x1="1120" y1="580" x2="1120" y2="620" stroke="#2c5cda" stroke-width="4" marker-end="url(#arrowhead)"/>

  <!-- Application Note -->
  <g id="application-note">
    <rect x="200" y="630" width="500" height="280" fill="#f0f0f0" stroke="#2c5cda" stroke-width="2" rx="12"/>

    <text x="450" y="675" class="step-title" text-anchor="middle" fill="#2c5cda">
      💡 Key Insight
    </text>

    <text x="230" y="720" class="step-text">
      <tspan x="230" dy="0">This workflow is directly</tspan>
      <tspan x="230" dy="30">applicable to climate-health</tspan>
      <tspan x="230" dy="30">research:</tspan>
    </text>

    <text x="240" y="815" class="step-text" font-size="18">
      <tspan x="240" dy="0">• Replace metal exposures</tspan>
      <tspan x="240" dy="25">  with climate variables</tspan>
      <tspan x="240" dy="25">• Apply same SHAP approach</tspan>
      <tspan x="240" dy="25">• Identify key predictors</tspan>
    </text>
  </g>

  <!-- Branding -->
  <g id="branding">
    <text x="1820" y="1045" class="branding-text" text-anchor="end">
      Wits Planetary Health Research
    </text>
  </g>

</svg>
