<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1920 1080"
     width="1920"
     height="1080">

  <defs>
    <linearGradient id="step1-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c5cda;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5c9ed4;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="step2-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00bec5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#20a3fc;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="step3-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d68910;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f39c12;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="step4-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e67e22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc1a1b;stop-opacity:1" />
    </linearGradient>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2c5cda" />
    </marker>
  </defs>

  <!-- Background -->
  <g id="background">
    <rect width="1920" height="1080" fill="#ffffff"/>
    <rect x="0" y="0" width="1920" height="8" fill="url(#step1-grad)"/>
  </g>

  <!-- Title -->
  <g id="title">
    <text x="960" y="90" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="64" letter-spacing="-1.28" font-weight="700" fill="#2c5cda">
      Proposed Integrated Workflow
    </text>
    <text x="960" y="140" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#666666">
      Combining SHAP Screening with DLNM/Random Effects Inference
    </text>
    <line x1="200" y1="160" x2="1720" y2="160" stroke="#e0e0e0" stroke-width="2"/>
  </g>

  <!-- Step 1 -->
  <g id="step1" transform="translate(150, 220)">
    <rect x="0" y="0" width="380" height="280" fill="#ffffff" stroke="#2c5cda" stroke-width="3" rx="12"/>

    <circle cx="190" cy="-30" r="45" fill="url(#step1-grad)"/>
    <text x="190" y="-10" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">1</text>

    <text x="190" y="45" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#1a1a1a">ML + SHAP</text>
    <text x="190" y="78" text-anchor="middle" font-size="32" font-family="Inter, Arial, sans-serif" font-weight="700" fill="#1a1a1a">Screening</text>

    <text x="30" y="125" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#424242">
      <tspan x="30" dy="0">Build ML model (XGBoost)</tspan>
      <tspan x="30" dy="30">on all climate/socio-econ/</tspan>
      <tspan x="30" dy="30">land-use features</tspan>
    </text>

    <rect x="20" y="205" width="340" height="55" fill="#e3ecfc" rx="6"/>
    <text x="30" y="235" font-size="22" font-weight="400" fill="#424242" font-family="Inter, Arial, sans-serif">
      <tspan x="30" dy="0">Output: SHAP feature</tspan>
      <tspan x="30" dy="22">importance rankings</tspan>
    </text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="560" y1="360" x2="720" y2="360" stroke="#2c5cda" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g id="step2" transform="translate(750, 220)">
    <rect x="0" y="0" width="380" height="280" fill="#ffffff" stroke="#00bec5" stroke-width="3" rx="12"/>

    <circle cx="190" cy="-30" r="45" fill="url(#step2-grad)"/>
    <text x="190" y="-10" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">2</text>

    <text x="190" y="45" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#1a1a1a">SHAP Inspection</text>

    <text x="30" y="105" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#424242">
      <tspan x="30" dy="0">Examine dependence plots</tspan>
      <tspan x="30" dy="30">→ Identify non-linearities</tspan>
      <tspan x="30" dy="30">→ Detect thresholds</tspan>
      <tspan x="30" dy="30">→ Find interactions</tspan>
    </text>

    <rect x="20" y="205" width="340" height="55" fill="#d4f4f4" rx="6"/>
    <text x="30" y="235" font-size="22" font-weight="400" fill="#424242" font-family="Inter, Arial, sans-serif">
      <tspan x="30" dy="0">Output: Exposure patterns</tspan>
      <tspan x="30" dy="22">for model specification</tspan>
    </text>
  </g>

  <!-- Arrow 2 to 3 -->
  <line x1="1160" y1="360" x2="1320" y2="360" stroke="#2c5cda" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g id="step3" transform="translate(1350, 220)">
    <rect x="0" y="0" width="380" height="280" fill="#ffffff" stroke="#d68910" stroke-width="3" rx="12"/>

    <circle cx="190" cy="-30" r="45" fill="url(#step3-grad)"/>
    <text x="190" y="-10" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">3</text>

    <text x="190" y="45" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#1a1a1a">DLNM/Random</text>
    <text x="190" y="78" text-anchor="middle" font-size="32" font-family="Inter, Arial, sans-serif" font-weight="700" fill="#1a1a1a">Effects Modelling</text>

    <text x="30" y="125" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#424242">
      <tspan x="30" dy="0">Specify models for top</tspan>
      <tspan x="30" dy="30">exposures with:</tspan>
      <tspan x="30" dy="30">• Lag structure</tspan>
      <tspan x="30" dy="30">• Spatial random effects</tspan>
    </text>

    <rect x="20" y="205" width="340" height="55" fill="#fdeaa8" rx="6"/>
    <text x="30" y="235" font-size="22" font-weight="400" fill="#424242" font-family="Inter, Arial, sans-serif">
      <tspan x="30" dy="0">Output: Effect estimates,</tspan>
      <tspan x="30" dy="22">lag curves, heterogeneity</tspan>
    </text>
  </g>

  <!-- Step 4 -->
  <g id="step4" transform="translate(750, 600)">
    <rect x="0" y="0" width="380" height="280" fill="#ffffff" stroke="#e67e22" stroke-width="3" rx="12"/>

    <circle cx="190" cy="-30" r="45" fill="url(#step4-grad)"/>
    <text x="190" y="-10" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">4</text>

    <text x="190" y="45" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#1a1a1a">Triangulation</text>

    <text x="30" y="105" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#424242">
      <tspan x="30" dy="0">Compare SHAP rankings</tspan>
      <tspan x="30" dy="30">with DLNM effect sizes</tspan>
    </text>

    <text x="30" y="180" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#424242">
      <tspan x="30" dy="0">Build heat-vulnerability</tspan>
      <tspan x="30" dy="30">index using both insights</tspan>
    </text>

    <rect x="20" y="225" width="340" height="35" fill="#fde4cd" rx="6"/>
    <text x="190" y="250" font-size="22" font-weight="400" fill="#424242" text-anchor="middle" font-family="Inter, Arial, sans-serif">
      Final interpretable model
    </text>
  </g>

  <!-- Arrow 3 to 4 -->
  <line x1="1540" y1="530" x2="1540" y2="560" stroke="#2c5cda" stroke-width="5"/>
  <line x1="1540" y1="560" x2="1160" y2="560" stroke="#2c5cda" stroke-width="5"/>
  <line x1="1160" y1="560" x2="1160" y2="590" stroke="#2c5cda" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Key Benefit Box -->
  <rect x="150" y="930" width="580" height="80" fill="#e3ecfc" stroke="#2c5cda" stroke-width="2" rx="8"/>
  <text x="170" y="970" font-size="22" font-weight="400" fill="#424242" font-family="Inter, Arial, sans-serif">
    <tspan x="170" dy="0">Uses ML/SHAP breadth for discovery,</tspan>
    <tspan x="170" dy="28">DLNM/random effects depth for inference</tspan>
  </text>

  <!-- Branding -->
  <g id="branding">
    <text x="1800" y="1045" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#666666">
      Wits Planetary Health Research
    </text>
  </g>

</svg>
