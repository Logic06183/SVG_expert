<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1920 1080"
     width="1920"
     height="1080">

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');

      .slide-title {
        font-family: 'Inter', sans-serif;
        font-size: 48px;
        font-weight: 700;
        fill: #1a1a1a;
        letter-spacing: -0.02em;
      }
      .section-header {
        font-family: 'Inter', sans-serif;
        font-size: 32px;
        font-weight: 700;
        fill: #ffffff;
      }
      .body-text {
        font-family: 'Inter', sans-serif;
        font-size: 20px;
        font-weight: 400;
        fill: #424242;
        line-height: 1.5;
      }
      .highlight-text {
        font-family: 'Inter', sans-serif;
        font-size: 20px;
        font-weight: 700;
        fill: #2c5cda;
      }
      .citation {
        font-family: 'Inter', sans-serif;
        font-size: 16px;
        font-weight: 400;
        fill: #666666;
        font-style: italic;
      }
      .branding-text {
        font-family: 'Inter', sans-serif;
        font-size: 18px;
        font-weight: 400;
        fill: #666666;
      }
    </style>

    <linearGradient id="header-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2c5cda;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00bec5;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="header-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e67e22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <g id="background">
    <rect width="1920" height="1080" fill="#ffffff"/>
    <rect x="0" y="0" width="1920" height="6" fill="url(#header-left)"/>
  </g>

  <!-- Title -->
  <g id="title">
    <text x="960" y="90" class="slide-title" text-anchor="middle">
      SHAP in Obstetric Prediction
    </text>
    <text x="960" y="135" class="body-text" text-anchor="middle" fill="#666666">
      Postpartum Hemorrhage Risk in Vaginal Births (2025)
    </text>
    <line x1="200" y1="155" x2="1720" y2="155" stroke="#e0e0e0" stroke-width="2"/>
  </g>

  <!-- Left Column: Key Findings -->
  <g id="left-column">
    <rect x="100" y="190" width="850" height="680" fill="#ffffff" stroke="#2c5cda" stroke-width="3" rx="12"/>

    <rect x="100" y="190" width="850" height="60" fill="url(#header-left)" rx="12"/>
    <rect x="100" y="220" width="850" height="30" fill="url(#header-left)"/>
    <text x="525" y="237" class="section-header" text-anchor="middle">Key Findings</text>

    <!-- Finding 1 -->
    <circle cx="130" cy="295" r="6" fill="#2c5cda"/>
    <text x="155" y="300" class="body-text">
      <tspan x="155" dy="0">Retrospective cohort of women with</tspan>
      <tspan x="155" dy="28">vaginal births</tspan>
    </text>

    <!-- Finding 2 -->
    <circle cx="130" cy="360" r="6" fill="#2c5cda"/>
    <text x="155" y="365" class="body-text">
      <tspan x="155" dy="0">Outcome: Postpartum hemorrhage (PPH)</tspan>
    </text>

    <!-- Finding 3 -->
    <circle cx="130" cy="410" r="6" fill="#2c5cda"/>
    <text x="155" y="415" class="body-text">
      <tspan x="155" dy="0">Machine learning model + SHAP used for</tspan>
      <tspan x="155" dy="28">prediction and interpretation</tspan>
    </text>

    <!-- Finding 4 -->
    <rect x="120" y="460" width="810" height="105" fill="#e3ecfc" stroke="#2c5cda" stroke-width="2" rx="8"/>
    <text x="140" y="490" class="body-text" font-weight="600">SHAP Analysis Benefits:</text>

    <circle cx="140" cy="525" r="5" fill="#2c5cda"/>
    <text x="165" y="530" class="body-text">
      <tspan x="165" dy="0">Identified key predictors of PPH</tspan>
    </text>

    <circle cx="140" cy="555" r="5" fill="#2c5cda"/>
    <text x="165" y="560" class="body-text">
      <tspan x="165" dy="0">Ranked clinical factors by importance</tspan>
    </text>

    <!-- Finding 5 -->
    <text x="130" y="605" class="body-text" font-weight="600">Clinical Relevance:</text>

    <circle cx="130" cy="640" r="5" fill="#00bec5"/>
    <text x="155" y="645" class="body-text">
      <tspan x="155" dy="0">Model can assist in real-time risk assessment</tspan>
      <tspan x="155" dy="28">during labor</tspan>
    </text>

    <circle cx="130" cy="695" r="5" fill="#00bec5"/>
    <text x="155" y="700" class="body-text">
      <tspan x="155" dy="0">SHAP values provide interpretable predictions</tspan>
      <tspan x="155" dy="28">for clinicians</tspan>
    </text>

    <!-- Note -->
    <rect x="120" y="745" width="810" height="105" fill="#f4f4f4" rx="8"/>
    <text x="140" y="775" class="body-text" font-size="18" fill="#666666">
      <tspan x="140" dy="0">Demonstrates SHAP in health systems prediction—</tspan>
      <tspan x="140" dy="26">methodology transferable despite different clinical</tspan>
      <tspan x="140" dy="26">domain (obstetrics vs climate-health).</tspan>
    </text>
  </g>

  <!-- Right Column: Relevance -->
  <g id="right-column">
    <rect x="970" y="190" width="850" height="680" fill="#ffffff" stroke="#e67e22" stroke-width="3" rx="12"/>

    <rect x="970" y="190" width="850" height="60" fill="url(#header-right)" rx="12"/>
    <rect x="970" y="220" width="850" height="30" fill="url(#header-right)"/>
    <text x="1395" y="237" class="section-header" text-anchor="middle">Relevance to Your Work</text>

    <!-- Relevance 1 -->
    <text x="1000" y="295" class="body-text" font-weight="600" fill="#e67e22">
      Methodological Precedent
    </text>

    <circle cx="1000" cy="330" r="5" fill="#e67e22"/>
    <text x="1025" y="335" class="body-text">
      <tspan x="1025" dy="0">Shows SHAP works in obstetric outcomes—</tspan>
      <tspan x="1025" dy="28">direct relevance to your preterm birth work</tspan>
    </text>

    <circle cx="1000" cy="390" r="5" fill="#e67e22"/>
    <text x="1025" y="395" class="body-text">
      <tspan x="1025" dy="0">Validates ML + SHAP for birth-related health</tspan>
      <tspan x="1025" dy="28">outcomes</tspan>
    </text>

    <!-- Relevance 2 -->
    <text x="1000" y="460" class="body-text" font-weight="600" fill="#e67e22">
      Clinical Risk Prediction
    </text>

    <circle cx="1000" cy="495" r="5" fill="#e67e22"/>
    <text x="1025" y="500" class="body-text">
      <tspan x="1025" dy="0">PPH prediction model parallels your preterm</tspan>
      <tspan x="1025" dy="28">birth risk modelling</tspan>
    </text>

    <circle cx="1000" cy="550" r="5" fill="#e67e22"/>
    <text x="1025" y="555" class="body-text">
      <tspan x="1025" dy="0">Both require interpretable predictions for</tspan>
      <tspan x="1025" dy="28">clinical/public health action</tspan>
    </text>

    <!-- Relevance 3 -->
    <text x="1000" y="620" class="body-text" font-weight="600" fill="#e67e22">
      Interpretability for Stakeholders
    </text>

    <circle cx="1000" cy="655" r="5" fill="#e67e22"/>
    <text x="1025" y="660" class="body-text">
      <tspan x="1025" dy="0">SHAP makes "black box" models transparent—</tspan>
      <tspan x="1025" dy="28">critical for policy/health system buy-in</tspan>
    </text>

    <circle cx="1000" cy="710" r="5" fill="#e67e22"/>
    <text x="1025" y="715" class="body-text">
      <tspan x="1025" dy="0">Your work: explain climate-preterm birth</tspan>
      <tspan x="1025" dy="28">associations to non-technical audiences</tspan>
    </text>

    <!-- Application -->
    <rect x="990" y="760" width="810" height="90" fill="#fde4cd" stroke="#e67e22" stroke-width="2" rx="8"/>
    <text x="1010" y="790" class="body-text" font-size="18" font-weight="600" fill="#7d3f0e">
      💡 Your Pipeline Application
    </text>
    <text x="1010" y="818" class="body-text" font-size="17" fill="#7d3f0e">
      <tspan x="1010" dy="0">Apply same ML + SHAP framework to preterm birth</tspan>
      <tspan x="1010" dy="24">with climate exposures—interpretable for clinicians</tspan>
    </text>
  </g>

  <!-- Citation -->
  <g id="citation">
    <rect x="100" y="895" width="1720" height="85" fill="#f0f0f0" stroke="#d0d0d0" stroke-width="2" rx="8"/>
    <text x="120" y="925" class="citation" font-weight="600" fill="#2c5cda">Citation:</text>
    <text x="120" y="950" class="citation">
      "Integrating SHAP analysis with machine learning to predict postpartum hemorrhage in vaginal births"
    </text>
    <text x="120" y="970" class="citation">
      BMC Pregnancy and Childbirth, 2025
    </text>
  </g>

  <!-- Branding -->
  <g id="branding">
    <text x="1800" y="1045" class="branding-text" text-anchor="end">
      Wits Planetary Health Research
    </text>
  </g>

</svg>
