<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1920 1080"
     width="1920"
     height="1080">

  <defs>
    <linearGradient id="header-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#cc1a1b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <g id="background">
    <rect width="1920" height="1080" fill="#ffffff"/>
    <rect x="0" y="0" width="1920" height="8" fill="url(#header-gradient)"/>
  </g>

  <!-- Title -->
  <g id="title">
    <text x="960" y="100" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="64" letter-spacing="-1.28" font-weight="700" fill="#2c5cda">
      Key Cautions &amp; Methodological Considerations
    </text>
    <line x1="200" y1="130" x2="1720" y2="130" stroke="#e0e0e0" stroke-width="2"/>
  </g>

  <!-- Content -->
  <g id="content">
    <!-- Warning Icon -->
    <text x="960" y="200" style="font-size: 48px;" text-anchor="middle">⚠️</text>

    <!-- Caution 1 -->
    <rect x="100" y="230" width="1720" height="180" fill="#fde4cd" stroke="#cc1a1b" stroke-width="3" rx="12"/>

    <text x="130" y="275" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#cc1a1b">1. Feature Correlation & Multicollinearity</text>

    <text x="160" y="320" font-weight="400" font-family="Inter, Arial, sans-serif" font-size="22" fill="#424242">Problem:</text>
    <text x="160" y="353" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#424242">
      Climate exposures highly correlated (max temp, heat index, humidity, land surface temp)
    </text>

    <text x="160" y="390" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#00bec5">Mitigation:</text>
    <text x="240" y="390" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#424242">
      • Cluster correlated exposures (PCA/domain grouping) • Be explicit about ambiguity in SHAP rankings
    </text>

    <!-- Caution 2 -->
    <rect x="100" y="440" width="1720" height="180" fill="#e3ecfc" stroke="#2c5cda" stroke-width="3" rx="12"/>

    <text x="130" y="485" fill="#cc1a1b" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">2. Temporal/Lag Structure</text>

    <text x="160" y="530" font-weight="400" font-family="Inter, Arial, sans-serif" font-size="22" fill="#424242">Problem:</text>
    <text x="160" y="563" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#424242">
      ML + SHAP doesn't inherently model lags unless features include lagged exposures
    </text>

    <text x="160" y="600" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#00bec5">Solution:</text>
    <text x="240" y="600" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#424242">
      • Include lagged features in ML input • Use DLNM for explicit lag-response modelling
    </text>

    <!-- Caution 3 -->
    <rect x="100" y="650" width="1720" height="180" fill="#f4f4f4" stroke="#666666" stroke-width="3" rx="12"/>

    <text x="130" y="695" fill="#cc1a1b" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">3. Causality vs Prediction</text>

    <text x="160" y="740" font-weight="400" font-family="Inter, Arial, sans-serif" font-size="22" fill="#424242">Critical distinction:</text>
    <text x="160" y="773" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#424242">
      • SHAP explains <tspan font-weight="700">model behavior</tspan> (prediction attribution)
    </text>
    <text x="160" y="806" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#424242">
      • DLNM estimates <tspan font-weight="700">causal associations</tspan> (with stated assumptions)
    </text>

    <!-- Caution 4 -->
    <rect x="100" y="860" width="840" height="160" fill="#fdeaa8" stroke="#d68910" stroke-width="2" rx="12"/>

    <text x="130" y="905" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#2c5cda">Interpretability for Stakeholders</text>

    <text x="160" y="950" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#424242">
      • SHAP: Exploratory narrative
    </text>
    <text x="160" y="983" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#424242">
      • DLNM: Dose-response curves for policy
    </text>

    <!-- Caution 5 -->
    <rect x="980" y="860" width="840" height="160" fill="#d4f4f4" stroke="#00bec5" stroke-width="2" rx="12"/>

    <text x="1010" y="905" fill="#2c5cda" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">Computational Resources</text>

    <text x="1040" y="950" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#424242">
      • ML + SHAP: Memory/compute intensive
    </text>
    <text x="1040" y="983" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#424242">
      • Spatial DLNM: Can be heavy but simpler
    </text>
  </g>

  <!-- Key References -->
  <g id="references">
    <text x="120" y="1055" font-size="22" fill="#424242" font-style="italic" font-family="Inter, Arial, sans-serif" font-weight="400">
      Key references: Kumar et al. 2020 (SHAP limitations); Bhaskaran et al. 2013 (DLNM autocorrelation); Molnar 2022 (Interpretable ML)
    </text>
  </g>

  <!-- Branding -->
  <g id="branding">
    <text x="1800" y="1060" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#666666">
      Wits Planetary Health Research
    </text>
  </g>

</svg>
