<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1920 1080"
     width="1920"
     height="1080">

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');

      .slide-title {
        font-family: 'Inter', sans-serif;
        font-size: 48px;
        font-weight: 700;
        fill: #1a1a1a;
        letter-spacing: -0.02em;
      }
      .section-header {
        font-family: 'Inter', sans-serif;
        font-size: 32px;
        font-weight: 700;
        fill: #ffffff;
      }
      .body-text {
        font-family: 'Inter', sans-serif;
        font-size: 20px;
        font-weight: 400;
        fill: #424242;
        line-height: 1.5;
      }
      .highlight-text {
        font-family: 'Inter', sans-serif;
        font-size: 20px;
        font-weight: 700;
        fill: #2c5cda;
      }
      .citation {
        font-family: 'Inter', sans-serif;
        font-size: 16px;
        font-weight: 400;
        fill: #666666;
        font-style: italic;
      }
      .branding-text {
        font-family: 'Inter', sans-serif;
        font-size: 18px;
        font-weight: 400;
        fill: #666666;
      }
    </style>

    <linearGradient id="header-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2c5cda;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00bec5;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="header-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e67e22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d68910;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <g id="background">
    <rect width="1920" height="1080" fill="#ffffff"/>
    <rect x="0" y="0" width="1920" height="6" fill="url(#header-left)"/>
  </g>

  <!-- Title -->
  <g id="title">
    <text x="960" y="90" class="slide-title" text-anchor="middle">
      SHAP &amp; Social Determinants of Health
    </text>
    <text x="960" y="135" class="body-text" text-anchor="middle" fill="#666666">
      Post-Stroke Depression &amp; Multi-Dimensional Exposures (2025)
    </text>
    <line x1="200" y1="155" x2="1720" y2="155" stroke="#e0e0e0" stroke-width="2"/>
  </g>

  <!-- Left Column: Key Findings -->
  <g id="left-column">
    <rect x="100" y="190" width="850" height="680" fill="#ffffff" stroke="#2c5cda" stroke-width="3" rx="12"/>

    <rect x="100" y="190" width="850" height="60" fill="url(#header-left)" rx="12"/>
    <rect x="100" y="220" width="850" height="30" fill="url(#header-left)"/>
    <text x="525" y="237" class="section-header" text-anchor="middle">Key Findings</text>

    <!-- Finding 1 -->
    <circle cx="130" cy="295" r="6" fill="#2c5cda"/>
    <text x="155" y="300" class="body-text">
      <tspan x="155" dy="0">Sample: ~70,000 NHANES participants</tspan>
    </text>

    <!-- Finding 2 -->
    <circle cx="130" cy="345" r="6" fill="#2c5cda"/>
    <text x="155" y="350" class="body-text">
      <tspan x="155" dy="0">Outcome: Post-stroke depression (PSD)</tspan>
    </text>

    <!-- Finding 3 -->
    <circle cx="130" cy="395" r="6" fill="#2c5cda"/>
    <text x="155" y="400" class="body-text">
      <tspan x="155" dy="0">Best algorithm: CatBoost (AUC = 0.966)</tspan>
    </text>

    <!-- Finding 4 -->
    <rect x="120" y="435" width="810" height="175" fill="#e3ecfc" stroke="#2c5cda" stroke-width="2" rx="8"/>
    <text x="140" y="465" class="body-text" font-weight="600">SHAP: Social Determinants as Strong Predictors</text>

    <circle cx="140" cy="500" r="5" fill="#2c5cda"/>
    <text x="160" y="505" class="body-text">Income level</text>

    <circle cx="140" cy="530" r="5" fill="#2c5cda"/>
    <text x="160" y="535" class="body-text">Education attainment</text>

    <circle cx="140" cy="560" r="5" fill="#2c5cda"/>
    <text x="160" y="565" class="body-text">Food security status</text>

    <circle cx="140" cy="590" r="5" fill="#2c5cda"/>
    <text x="160" y="595" class="body-text">Homeownership</text>

    <!-- Finding 5 -->
    <text x="130" y="650" class="body-text" font-weight="600">Model Performance:</text>

    <circle cx="130" cy="685" r="5" fill="#00bec5"/>
    <text x="155" y="690" class="body-text">
      <tspan x="155" dy="0">Excellent discrimination (AUC ~0.97)</tspan>
    </text>

    <circle cx="130" cy="720" r="5" fill="#00bec5"/>
    <text x="155" y="725" class="body-text">
      <tspan x="155" dy="0">SHAP revealed interactions between social</tspan>
      <tspan x="155" dy="28">and clinical factors</tspan>
    </text>

    <!-- Note -->
    <rect x="120" y="770" width="810" height="80" fill="#f4f4f4" rx="8"/>
    <text x="140" y="800" class="body-text" font-size="18" fill="#666666">
      <tspan x="140" dy="0">Demonstrates ML + SHAP for multi-dimensional</tspan>
      <tspan x="140" dy="26">health outcomes combining social &amp; clinical data.</tspan>
    </text>
  </g>

  <!-- Right Column: Relevance -->
  <g id="right-column">
    <rect x="970" y="190" width="850" height="680" fill="#ffffff" stroke="#e67e22" stroke-width="3" rx="12"/>

    <rect x="970" y="190" width="850" height="60" fill="url(#header-right)" rx="12"/>
    <rect x="970" y="220" width="850" height="30" fill="url(#header-right)"/>
    <text x="1395" y="237" class="section-header" text-anchor="middle">Relevance to Your Work</text>

    <!-- Relevance 1 -->
    <text x="1000" y="295" class="body-text" font-weight="600" fill="#e67e22">
      Integrating Socio-Economic Variables
    </text>

    <circle cx="1000" cy="330" r="5" fill="#e67e22"/>
    <text x="1025" y="335" class="body-text">
      <tspan x="1025" dy="0">Shows SHAP works with social determinants</tspan>
      <tspan x="1025" dy="28">(SDoH) + health outcomes</tspan>
    </text>

    <circle cx="1000" cy="390" r="5" fill="#e67e22"/>
    <text x="1025" y="395" class="body-text">
      <tspan x="1025" dy="0">You already use socio-economic variables—</tspan>
      <tspan x="1025" dy="28">this validates SHAP for combined</tspan>
      <tspan x="1025" dy="28">climate + social exposure models</tspan>
    </text>

    <!-- Relevance 2 -->
    <text x="1000" y="485" class="body-text" font-weight="600" fill="#e67e22">
      Multi-Dimensional Risk Factors
    </text>

    <circle cx="1000" cy="520" r="5" fill="#e67e22"/>
    <text x="1025" y="525" class="body-text">
      <tspan x="1025" dy="0">PSD prediction uses clinical + social data—</tspan>
      <tspan x="1025" dy="28">parallel to your climate + land-use +</tspan>
      <tspan x="1025" dy="28">socio-economic exposures</tspan>
    </text>

    <circle cx="1000" cy="605" r="5" fill="#e67e22"/>
    <text x="1025" y="610" class="body-text">
      <tspan x="1025" dy="0">SHAP can rank complex, correlated predictors</tspan>
    </text>

    <!-- Relevance 3 -->
    <text x="1000" y="665" class="body-text" font-weight="600" fill="#e67e22">
      Large-Scale Population Data
    </text>

    <circle cx="1000" cy="700" r="5" fill="#e67e22"/>
    <text x="1025" y="705" class="body-text">
      <tspan x="1025" dy="0">NHANES provides nationally representative</tspan>
      <tspan x="1025" dy="28">sample—similar scale to your birth registry</tspan>
    </text>

    <!-- Application -->
    <rect x="990" y="755" width="810" height="95" fill="#fde4cd" stroke="#e67e22" stroke-width="2" rx="8"/>
    <text x="1010" y="785" class="body-text" font-size="18" font-weight="600" fill="#7d3f0e">
      💡 Your Pipeline Application
    </text>
    <text x="1010" y="813" class="body-text" font-size="17" fill="#7d3f0e">
      <tspan x="1010" dy="0">Integrate socio-economic + climate exposures in</tspan>
      <tspan x="1010" dy="24">CatBoost models for preterm birth → use SHAP to</tspan>
      <tspan x="1010" dy="24">identify key social/environmental interactions</tspan>
    </text>
  </g>

  <!-- Citation -->
  <g id="citation">
    <rect x="100" y="895" width="1720" height="85" fill="#f0f0f0" stroke="#d0d0d0" stroke-width="2" rx="8"/>
    <text x="120" y="925" class="citation" font-weight="600" fill="#2c5cda">Citation:</text>
    <text x="120" y="950" class="citation">
      "Machine learning and SHAP values explain the association between social determinants of health
    </text>
    <text x="120" y="970" class="citation">
      and post-stroke depression" | BMC Public Health, 2025
    </text>
  </g>

  <!-- Branding -->
  <g id="branding">
    <text x="1800" y="1045" class="branding-text" text-anchor="end">
      Wits Planetary Health Research
    </text>
  </g>

</svg>
