  <!-- Interpretation box -->
  <g id="interpretation">
    <rect x="100" y="840" width="1740" height="110" fill="#e3ecfc" rx="8"/>
    <text x="120" y="870" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#2c5cda">
      Key Findings:
    </text>
    <text x="120" y="900" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#424242">
      • Immediate effect (lag 0): Strong negative impact of extreme heat on CD4 count (RR &lt; 0.6 at 33°C)
    </text>
    <text x="120" y="925" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#424242">
      • Cumulative exposure: Risk doubles (RR = 2.15) over 14 days at sustained high temperatures (&gt;32°C)
    </text>
    <text x="120" y="950" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#424242">
      • Optimal temperature range: 20-24°C shows minimal impact (RR ≈ 1.0), with protection at moderate temperatures
    </text>
  </g>

  <!-- Method note -->
  <g id="method">
    <rect x="100" y="970" width="1740" height="60" fill="#f4f4f4" rx="8"/>
    <text x="120" y="1000" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#666666">
      Generated using R dlnm package with natural cubic splines (df=4 for temperature, df=3 for lag).
    </text>
    <text x="120" y="1020" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#666666">
      Reference temperature: 22°C. Model adjusted for seasonality, PM₂.₅, and socioeconomic confounders.
    </text>
  </g>

  <!-- Branding -->
  <g id="branding">
    <text x="1850" y="1060"
          text-anchor="end"
          font-family="Inter, Arial, sans-serif"
          font-size="16"
          font-weight="400"
          fill="#999999">
      Wits Planetary Health Research
    </text>
  </g>

</svg>
