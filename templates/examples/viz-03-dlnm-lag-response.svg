    <text x="1115" y="600" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">1.0</text>
    <text x="1115" y="480" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">1.5</text>
    <text x="1115" y="360" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">2.0</text>
    <text x="1115" y="240" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">2.5</text>

