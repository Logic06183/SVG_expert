<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1920 1080"
     width="1920"
     height="1080">

  <defs>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2c5cda;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00bec5;stop-opacity:1" />
    </linearGradient>

    <!-- Heat map gradient (blue-white-red) -->
    <linearGradient id="heatmap-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#67001f;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#d6604d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f7f7f7;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#4393c3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#053061;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <g id="background">
    <rect width="1920" height="1080" fill="#ffffff"/>
    <rect x="0" y="0" width="1920" height="6" fill="url(#header-grad)"/>
  </g>

  <!-- Title -->
  <g id="title">
    <text x="960" y="70"
          text-anchor="middle"
          font-family="Inter, Arial, sans-serif"
          font-size="56"
          font-weight="700"
          fill="#1a1a1a"
          letter-spacing="-1.12">
      DLNM: Temperature Lag-Response for CD4 Count
