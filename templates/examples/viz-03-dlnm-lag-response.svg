  <!-- Cumulative risk plot -->
  <g id="cumulative-plot">
    <rect x="1050" y="160" width="800" height="650" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>

    <!-- Title -->
    <text x="1450" y="195" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#1a1a1a">
      Cumulative Relative Risk by Temperature
    </text>

    <!-- Axes -->
    <line x1="1130" y1="720" x2="1780" y2="720" stroke="#424242" stroke-width="2"/>
    <line x1="1130" y1="240" x2="1130" y2="720" stroke="#424242" stroke-width="2"/>

    <!-- X-axis labels -->
