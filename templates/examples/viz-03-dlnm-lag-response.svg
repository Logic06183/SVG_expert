    <text x="1290" y="745" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">20</text>
    <text x="1450" y="745" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">25</text>
