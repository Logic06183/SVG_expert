    <!-- Main curve (exponential increase) -->
    <path d="M 1130 650 Q 1300 620, 1450 530 Q 1610 400, 1770 250"
          stroke="#cc1a1b"
          stroke-width="4"
          fill="none"/>

    <!-- Confidence interval (shaded area) -->
    <path d="M 1130 680 Q 1300 650, 1450 560 Q 1610 430, 1770 280 L 1770 220 Q 1610 370, 1450 500 Q 1300 590, 1130 620 Z"
          fill="#cc1a1b"
          opacity="0.2"/>

    <!-- Add some points -->
    <circle cx="1290" cy="615" r="5" fill="#cc1a1b"/>
    <circle cx="1450" cy="530" r="5" fill="#cc1a1b"/>
    <circle cx="1610" cy="400" r="5" fill="#cc1a1b"/>
    <circle cx="1770" cy="250" r="5" fill="#cc1a1b"/>

