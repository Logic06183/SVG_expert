<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1920 1080"
     width="1920"
     height="1080">

  <defs>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2c5cda;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00bec5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <g id="background">
    <rect width="1920" height="1080" fill="#ffffff"/>

    <!-- Decorative elements -->
    <circle cx="1650" cy="300" r="200" fill="#2c5cda" opacity="0.05"/>
    <circle cx="270" cy="850" r="180" fill="#00bec5" opacity="0.05"/>

    <!-- Top accent bar -->
    <rect x="0" y="0" width="1920" height="10" fill="url(#accent-gradient)"/>
  </g>

  <!-- Content -->
  <g id="content">
    <!-- Main Title -->
    <text x="960" y="360" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="84" font-weight="700" fill="#1a1a1a" letter-spacing="-1.68">
      Methodological Framework
    </text>

    <!-- Subtitle -->
    <text x="960" y="470" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="500" fill="#2c5cda">
      SHAP/Machine Learning vs
    </text>
    <text x="960" y="540" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="500" fill="#2c5cda">
      Traditional Statistical Approaches
    </text>

    <!-- Decorative line -->
    <line x1="560" y1="600" x2="1360" y2="600"
          stroke="#2c5cda"
          stroke-width="4"
          opacity="0.3"/>

    <!-- Context -->
    <text x="960" y="700" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="400" fill="#666666">
      Theoretical Basis for Climate-Health Research
    </text>

    <text x="960" y="760" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="400" fill="#666666">
      HE²AT Centre | Research Programme 2
    </text>
  </g>

  <!-- Branding -->
  <g id="branding">
    <rect x="760" y="920" width="400" height="100" fill="#f4f4f4" rx="12"/>
    <text x="960" y="980" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#2c5cda">
      Wits Planetary Health Research
    </text>
  </g>

</svg>
