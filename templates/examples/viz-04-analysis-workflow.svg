<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1920 1080"
     width="1920"
     height="1080">

  <defs>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2c5cda;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00bec5;stop-opacity:1" />
    </linearGradient>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2c5cda"/>
    </marker>
  </defs>

  <!-- Background -->
  <g id="background">
    <rect width="1920" height="1080" fill="#ffffff"/>
    <rect x="0" y="0" width="1920" height="6" fill="url(#header-grad)"/>
  </g>

  <!-- Title -->
  <g id="title">
    <text x="960" y="70"
          text-anchor="middle"
          font-family="Inter, Arial, sans-serif"
          font-size="56"
          font-weight="700"
          fill="#1a1a1a"
          letter-spacing="-1.12">
      Integrated Analysis Workflow: CD4 Prediction
    </text>
    <text x="960" y="110"
          text-anchor="middle"
          font-family="Inter, Arial, sans-serif"
          font-size="24"
          font-weight="400"
          fill="#666666">
      From feature screening to causal inference using ML and epidemiological methods
    </text>
  </g>

  <!-- Stage 1: Data & ML Model -->
  <g id="stage1">
    <rect x="80" y="160" width="420" height="320" fill="#ffffff" stroke="#2c5cda" stroke-width="3" rx="12"/>
    <rect x="80" y="160" width="420" height="50" fill="#2c5cda" rx="12"/>
    <rect x="80" y="190" width="420" height="20" fill="#2c5cda"/>

    <text x="290" y="195" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">
      Stage 1: Feature Screening
    </text>

    <!-- Content -->
    <text x="100" y="240" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1a1a1a">
      Data Input
    </text>
    <text x="120" y="265" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#424242">
      • Climate: Temp, rainfall, PM₂.₅
    </text>
    <text x="120" y="287" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#424242">
      • Socioeconomic: Income, education
    </text>
    <text x="120" y="309" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#424242">
      • Built environment: NDVI, density
    </text>

    <text x="100" y="345" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1a1a1a">
      ML Model
    </text>
    <text x="120" y="370" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#424242">
      • XGBoost / Random Forest
    </text>
    <text x="120" y="392" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#424242">
      • Captures non-linear patterns
    </text>
    <text x="120" y="414" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#424242">
      • Handles high dimensions
    </text>

    <rect x="100" y="435" width="380" height="30" fill="#e3ecfc" rx="6"/>
    <text x="290" y="456" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#2c5cda">
      Output: Predictive Model (R² = 0.78)
    </text>
  </g>

  <!-- Arrow 1 -->
  <line x1="500" y1="320" x2="580" y2="320" stroke="#2c5cda" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="540" y="310" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#2c5cda">
    Explain
  </text>

  <!-- Stage 2: SHAP Interpretation -->
  <g id="stage2">
    <rect x="600" y="160" width="420" height="320" fill="#ffffff" stroke="#00bec5" stroke-width="3" rx="12"/>
    <rect x="600" y="160" width="420" height="50" fill="#00bec5" rx="12"/>
    <rect x="600" y="190" width="420" height="20" fill="#00bec5"/>

    <text x="810" y="195" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">
      Stage 2: SHAP Analysis
    </text>

    <!-- Mini bee swarm visualization -->
    <rect x="620" y="220" width="380" height="100" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" rx="6"/>
    <text x="810" y="240" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#424242">
      Feature Importance
    </text>

    <!-- Mini bars representing bee swarm -->
    <rect x="680" y="250" width="80" height="8" fill="#2c5cda" opacity="0.7"/>
    <text x="770" y="257" font-family="Inter, Arial, sans-serif" font-size="11" fill="#666666">Income</text>

    <rect x="680" y="265" width="70" height="8" fill="#00bec5" opacity="0.7"/>
    <text x="760" y="272" font-family="Inter, Arial, sans-serif" font-size="11" fill="#666666">Healthcare</text>

    <rect x="680" y="280" width="60" height="8" fill="#2c5cda" opacity="0.7"/>
    <text x="750" y="287" font-family="Inter, Arial, sans-serif" font-size="11" fill="#666666">Max Temp</text>

    <rect x="680" y="295" width="45" height="8" fill="#00bec5" opacity="0.7"/>
    <text x="735" y="302" font-family="Inter, Arial, sans-serif" font-size="11" fill="#666666">PM₂.₅</text>

    <!-- Dependence plots preview -->
    <text x="620" y="340" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">
      Non-linear Patterns
    </text>
    <text x="640" y="365" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#424242">
      • J-shaped temp curve
    </text>
    <text x="640" y="387" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#424242">
      • Income saturation effect
    </text>
    <text x="640" y="409" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#424242">
      • PM₂.₅ threshold at 30 µg/m³
    </text>

    <rect x="620" y="430" width="380" height="30" fill="#d4f4f4" rx="6"/>
    <text x="810" y="451" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#00bec5">
      Output: Top 5 Features + Relationships
    </text>
  </g>

  <!-- Arrow 2 -->
  <line x1="1020" y1="320" x2="1100" y2="320" stroke="#2c5cda" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1060" y="310" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#2c5cda">
    Specify
  </text>

  <!-- Stage 3: DLNM Causal Inference -->
  <g id="stage3">
    <rect x="1120" y="160" width="720" height="320" fill="#ffffff" stroke="#cc1a1b" stroke-width="3" rx="12"/>
    <rect x="1120" y="160" width="720" height="50" fill="#cc1a1b" rx="12"/>
    <rect x="1120" y="190" width="720" height="20" fill="#cc1a1b"/>

    <text x="1480" y="195" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">
      Stage 3: DLNM Causal Estimation
    </text>

    <!-- Mini heatmap preview -->
    <rect x="1150" y="220" width="250" height="150" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" rx="6"/>
    <text x="1275" y="240" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#424242">
      Lag-Response Surface
    </text>

    <!-- Simplified heatmap -->
    <rect x="1165" y="250" width="25" height="20" fill="#4393c3"/>
    <rect x="1190" y="250" width="25" height="20" fill="#d1e5f0"/>
    <rect x="1215" y="250" width="25" height="20" fill="#f7f7f7"/>
    <rect x="1240" y="250" width="25" height="20" fill="#fddbc7"/>
    <rect x="1265" y="250" width="25" height="20" fill="#f4a582"/>
    <rect x="1290" y="250" width="25" height="20" fill="#d6604d"/>
    <rect x="1315" y="250" width="25" height="20" fill="#b40426"/>

    <rect x="1165" y="270" width="25" height="20" fill="#d1e5f0"/>
    <rect x="1190" y="270" width="25" height="20" fill="#f7f7f7"/>
    <rect x="1215" y="270" width="25" height="20" fill="#fddbc7"/>
    <rect x="1240" y="270" width="25" height="20" fill="#f4a582"/>
    <rect x="1265" y="270" width="25" height="20" fill="#d6604d"/>
    <rect x="1290" y="270" width="25" height="20" fill="#ca4848"/>
    <rect x="1315" y="270" width="25" height="20" fill="#a42a2a"/>

    <rect x="1165" y="290" width="25" height="20" fill="#f7f7f7"/>
    <rect x="1190" y="290" width="25" height="20" fill="#fddbc7"/>
    <rect x="1215" y="290" width="25" height="20" fill="#f4a582"/>
    <rect x="1240" y="290" width="25" height="20" fill="#d6604d"/>
    <rect x="1265" y="290" width="25" height="20" fill="#ca4848"/>
    <rect x="1290" y="290" width="25" height="20" fill="#a42a2a"/>
    <rect x="1315" y="290" width="25" height="20" fill="#7e0c0c"/>

    <rect x="1165" y="310" width="25" height="20" fill="#fddbc7"/>
    <rect x="1190" y="310" width="25" height="20" fill="#f4a582"/>
    <rect x="1215" y="310" width="25" height="20" fill="#d6604d"/>
    <rect x="1240" y="310" width="25" height="20" fill="#ca4848"/>
    <rect x="1265" y="310" width="25" height="20" fill="#b73939"/>
    <rect x="1290" y="310" width="25" height="20" fill="#911b1b"/>
    <rect x="1315" y="310" width="25" height="20" fill="#67001f"/>

    <text x="1275" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#666666">
      Temp × Lag interaction
    </text>

    <!-- Cumulative curve preview -->
    <rect x="1430" y="220" width="390" height="150" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" rx="6"/>
    <text x="1625" y="240" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#424242">
      Cumulative Effect
    </text>

    <!-- Simple curve -->
    <path d="M 1450 330 Q 1550 310, 1650 270 Q 1750 240, 1800 250"
          stroke="#cc1a1b"
          stroke-width="3"
          fill="none"/>
    <line x1="1450" y1="300" x2="1800" y2="300" stroke="#999999" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
    <text x="1760" y="250" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#cc1a1b">
      RR=2.15
    </text>

    <!-- Key outputs -->
    <text x="1140" y="395" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">
      Causal Effect Estimates
    </text>
    <text x="1160" y="420" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#424242">
      • RR per °C above 25°C: 1.12 (95% CI: 1.08-1.16)
    </text>
    <text x="1160" y="442" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#424242">
      • Peak lag: 3-5 days for temperature effects
    </text>

    <rect x="1140" y="455" width="680" height="30" fill="#fde4cd" rx="6"/>
    <text x="1480" y="476" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#cc1a1b">
      Output: Policy-Relevant Effect Sizes + Confidence Intervals
    </text>
  </g>

  <!-- Bottom synthesis section -->
  <g id="synthesis">
    <rect x="80" y="520" width="1760" height="240" fill="#e3ecfc" rx="12"/>

    <text x="960" y="560" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#2c5cda">
      Integrated Insights for CD4 Count Prediction
    </text>

    <!-- Three columns of insights -->
    <g id="column1">
      <text x="200" y="610" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1a1a1a">
        ML + SHAP Screening
      </text>
      <text x="120" y="640" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#424242">
        ✓ Identified top 5 predictors from
      </text>
      <text x="130" y="660" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#424242">
        50+ candidate features
      </text>
      <text x="120" y="685" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#424242">
        ✓ Revealed non-linear patterns
      </text>
      <text x="120" y="710" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#424242">
        ✓ Temperature J-shape detected
      </text>
      <text x="120" y="735" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#424242">
        ✓ Threshold effects identified
      </text>
    </g>

    <g id="column2">
      <text x="730" y="610" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1a1a1a">
        DLNM Causal Inference
      </text>
      <text x="650" y="640" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#424242">
        ✓ Quantified lag-specific effects
      </text>
      <text x="650" y="665" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#424242">
        ✓ Peak risk at 3-5 day lag
      </text>
      <text x="650" y="690" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#424242">
        ✓ Cumulative 14-day RR: 2.15
      </text>
      <text x="650" y="715" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#424242">
        ✓ Controlled for confounding
      </text>
      <text x="650" y="740" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#424242">
        ✓ Policy-relevant effect sizes
      </text>
    </g>

    <g id="column3">
      <text x="1300" y="610" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1a1a1a">
        Public Health Implications
      </text>
      <text x="1180" y="640" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#424242">
        → Heat action plans needed at 30°C+
      </text>
      <text x="1180" y="665" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#424242">
        → Air quality interventions critical
      </text>
      <text x="1180" y="690" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#424242">
        → Income support reduces vulnerability
      </text>
      <text x="1180" y="715" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#424242">
        → Healthcare access enhancement
      </text>
      <text x="1180" y="740" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#424242">
        → Urban greening (NDVI) protective
      </text>
    </g>
  </g>

  <!-- Method summary -->
  <g id="methods">
    <rect x="80" y="790" width="1760" height="90" fill="#f4f4f4" rx="8"/>
    <text x="100" y="820" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#2c5cda">
      Methods Summary:
    </text>
    <text x="100" y="845" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#666666">
      Stage 1-2: XGBoost predictive model (Python scikit-learn) + SHAP interpretation (Python shap package)
    </text>
    <text x="100" y="865" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#666666">
      Stage 3: Distributed lag non-linear model with natural cubic splines (R dlnm package), adjusted for confounders
    </text>
  </g>

  <!-- Data info -->
  <g id="datainfo">
    <rect x="80" y="900" width="1760" height="60" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="8"/>
    <text x="100" y="930" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#666666">
      Dataset: N=12,450 observations | Johannesburg metro area | 2018-2023 | CD4 measurements from public health clinics
    </text>
    <text x="100" y="950" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#666666">
      Features: 52 climate, air quality, built environment, and socioeconomic variables at ward level (spatial resolution: 1km²)
    </text>
  </g>

  <!-- Branding -->
  <g id="branding">
    <rect x="80" y="980" width="1760" height="70" fill="#2c5cda" rx="8"/>
    <text x="960" y="1020"
          text-anchor="middle"
          font-family="Inter, Arial, sans-serif"
          font-size="22"
          font-weight="600"
          fill="#ffffff">
      Wits Planetary Health Research | HE²AT Centre Research Programme 2
    </text>
  </g>

</svg>
