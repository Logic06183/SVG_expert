<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1920 1080"
     width="1920"
     height="1080">

  <defs>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2c5cda;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00bec5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <g id="background">
    <rect width="1920" height="1080" fill="#ffffff"/>
    <rect x="0" y="0" width="1920" height="6" fill="url(#header-grad)"/>
  </g>

  <!-- Title -->
  <g id="title">
    <text x="960" y="70"
          text-anchor="middle"
          font-family="Inter, Arial, sans-serif"
          font-size="56"
          font-weight="700"
          fill="#1a1a1a"
          letter-spacing="-1.12">
      SHAP Dependence Plots: Non-Linear Relationships
    </text>
    <text x="960" y="110"
          text-anchor="middle"
          font-family="Inter, Arial, sans-serif"
          font-size="24"
          font-weight="400"
          fill="#666666">
      How individual features affect CD4 count predictions
    </text>
  </g>

  <!-- Plot 1: Maximum Temperature -->
  <g id="plot1">
    <rect x="80" y="160" width="520" height="400" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>

    <!-- Title -->
    <text x="340" y="195" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#1a1a1a">
      Maximum Temperature (°C)
    </text>

    <!-- Axes -->
    <line x1="140" y1="520" x2="560" y2="520" stroke="#424242" stroke-width="2"/>
    <line x1="140" y1="240" x2="140" y2="520" stroke="#424242" stroke-width="2"/>

    <!-- X-axis labels -->
    <text x="140" y="545" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">15</text>
    <text x="245" y="545" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">20</text>
    <text x="350" y="545" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">25</text>
    <text x="455" y="545" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">30</text>
    <text x="560" y="545" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">35</text>

    <!-- Y-axis labels -->
    <text x="125" y="520" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">-1</text>
    <text x="125" y="450" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">-0.5</text>
    <text x="125" y="380" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">0</text>
    <text x="125" y="310" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">0.5</text>
    <text x="125" y="240" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">1</text>

    <!-- Axis labels -->
    <text x="350" y="575" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#424242">
      Temperature (°C)
    </text>
    <text x="95" y="380" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#424242" transform="rotate(-90, 95, 380)">
      SHAP value
    </text>

    <!-- Zero line -->
    <line x1="140" y1="380" x2="560" y2="380" stroke="#999999" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

    <!-- Scatter points showing non-linear relationship (J-shaped) -->
    <!-- Low temps: slightly negative -->
    <circle cx="150" cy="410" r="4" fill="#7fb3d5" opacity="0.6"/>
    <circle cx="160" cy="420" r="4" fill="#7fb3d5" opacity="0.6"/>
    <circle cx="170" cy="415" r="4" fill="#9dc2e0" opacity="0.6"/>
    <circle cx="180" cy="425" r="4" fill="#9dc2e0" opacity="0.6"/>

    <!-- Mid temps: near zero -->
    <circle cx="220" cy="390" r="4" fill="#c9d9e8" opacity="0.6"/>
    <circle cx="240" cy="385" r="4" fill="#c9d9e8" opacity="0.6"/>
    <circle cx="260" cy="380" r="4" fill="#e8e8e8" opacity="0.6"/>
    <circle cx="280" cy="375" r="4" fill="#e8e8e8" opacity="0.6"/>
    <circle cx="300" cy="370" r="4" fill="#f7d9d9" opacity="0.6"/>

    <!-- High temps: increasingly positive (heat stress) -->
    <circle cx="340" cy="350" r="4" fill="#d9534f" opacity="0.6"/>
    <circle cx="360" cy="330" r="4" fill="#d9534f" opacity="0.6"/>
    <circle cx="380" cy="310" r="4" fill="#c9434f" opacity="0.6"/>
    <circle cx="400" cy="285" r="4" fill="#b40426" opacity="0.6"/>
    <circle cx="420" cy="270" r="4" fill="#b40426" opacity="0.6"/>
    <circle cx="440" cy="260" r="4" fill="#a40426" opacity="0.6"/>
    <circle cx="460" cy="250" r="4" fill="#a40426" opacity="0.6"/>
    <circle cx="480" cy="240" r="4" fill="#940426" opacity="0.6"/>
    <circle cx="500" cy="235" r="4" fill="#940426" opacity="0.6"/>
    <circle cx="520" cy="225" r="4" fill="#840426" opacity="0.6"/>
    <circle cx="540" cy="220" r="4" fill="#840426" opacity="0.6"/>

    <!-- Trend line (non-linear) -->
    <path d="M 140 415 Q 250 380, 350 340 T 560 215"
          stroke="#2c5cda"
          stroke-width="3"
          fill="none"
          opacity="0.7"/>
  </g>

  <!-- Plot 2: Household Income -->
  <g id="plot2">
    <rect x="700" y="160" width="520" height="400" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>

    <!-- Title -->
    <text x="960" y="195" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#1a1a1a">
      Household Income (ZAR/month)
    </text>

    <!-- Axes -->
    <line x1="760" y1="520" x2="1180" y2="520" stroke="#424242" stroke-width="2"/>
    <line x1="760" y1="240" x2="760" y2="520" stroke="#424242" stroke-width="2"/>

    <!-- X-axis labels -->
    <text x="760" y="545" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">0</text>
    <text x="865" y="545" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">5k</text>
    <text x="970" y="545" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">10k</text>
    <text x="1075" y="545" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">15k</text>
    <text x="1180" y="545" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">20k</text>

    <!-- Y-axis labels -->
    <text x="745" y="520" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">-1</text>
    <text x="745" y="450" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">-0.5</text>
    <text x="745" y="380" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">0</text>
    <text x="745" y="310" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">0.5</text>
    <text x="745" y="240" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">1</text>

    <!-- Axis labels -->
    <text x="970" y="575" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#424242">
      Income (ZAR/month)
    </text>
    <text x="715" y="380" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#424242" transform="rotate(-90, 715, 380)">
      SHAP value
    </text>

    <!-- Zero line -->
    <line x1="760" y1="380" x2="1180" y2="380" stroke="#999999" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

    <!-- Scatter points showing positive relationship with saturation -->
    <!-- Low income: negative impact -->
    <circle cx="770" cy="490" r="4" fill="#7fb3d5" opacity="0.6"/>
    <circle cx="790" cy="480" r="4" fill="#7fb3d5" opacity="0.6"/>
    <circle cx="810" cy="470" r="4" fill="#9dc2e0" opacity="0.6"/>
    <circle cx="830" cy="455" r="4" fill="#9dc2e0" opacity="0.6"/>
    <circle cx="850" cy="440" r="4" fill="#c9d9e8" opacity="0.6"/>

    <!-- Mid income: increasingly positive -->
    <circle cx="880" cy="420" r="4" fill="#c9d9e8" opacity="0.6"/>
    <circle cx="900" cy="395" r="4" fill="#e8e8e8" opacity="0.6"/>
    <circle cx="920" cy="370" r="4" fill="#d9e8f7" opacity="0.6"/>
    <circle cx="940" cy="345" r="4" fill="#4a7ae0" opacity="0.6"/>
    <circle cx="960" cy="325" r="4" fill="#4a7ae0" opacity="0.6"/>
    <circle cx="980" cy="305" r="4" fill="#3a6ad0" opacity="0.6"/>
    <circle cx="1000" cy="285" r="4" fill="#2c5cda" opacity="0.6"/>

    <!-- High income: saturating positive effect -->
    <circle cx="1020" cy="275" r="4" fill="#2c5cda" opacity="0.6"/>
    <circle cx="1040" cy="265" r="4" fill="#2c5cda" opacity="0.6"/>
    <circle cx="1060" cy="260" r="4" fill="#2c4cca" opacity="0.6"/>
    <circle cx="1080" cy="255" r="4" fill="#2c4cca" opacity="0.6"/>
    <circle cx="1100" cy="252" r="4" fill="#2c4cba" opacity="0.6"/>
    <circle cx="1120" cy="250" r="4" fill="#2c4cba" opacity="0.6"/>
    <circle cx="1140" cy="248" r="4" fill="#2c3caa" opacity="0.6"/>
    <circle cx="1160" cy="247" r="4" fill="#2c3caa" opacity="0.6"/>

    <!-- Trend line (logarithmic) -->
    <path d="M 760 495 Q 920 380, 1050 270 Q 1120 245, 1180 245"
          stroke="#00bec5"
          stroke-width="3"
          fill="none"
          opacity="0.7"/>
  </g>

  <!-- Plot 3: PM2.5 -->
  <g id="plot3">
    <rect x="1320" y="160" width="520" height="400" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>

    <!-- Title -->
    <text x="1580" y="195" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#1a1a1a">
      PM₂.₅ Concentration (µg/m³)
    </text>

    <!-- Axes -->
    <line x1="1380" y1="520" x2="1800" y2="520" stroke="#424242" stroke-width="2"/>
    <line x1="1380" y1="240" x2="1380" y2="520" stroke="#424242" stroke-width="2"/>

    <!-- X-axis labels -->
    <text x="1380" y="545" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">0</text>
    <text x="1485" y="545" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">25</text>
    <text x="1590" y="545" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">50</text>
    <text x="1695" y="545" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">75</text>
    <text x="1800" y="545" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">100</text>

    <!-- Y-axis labels -->
    <text x="1365" y="520" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">-1</text>
    <text x="1365" y="450" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">-0.5</text>
    <text x="1365" y="380" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">0</text>
    <text x="1365" y="310" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">0.5</text>
    <text x="1365" y="240" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14" fill="#666666">1</text>

    <!-- Axis labels -->
    <text x="1590" y="575" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#424242">
      PM₂.₅ (µg/m³)
    </text>
    <text x="1335" y="380" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#424242" transform="rotate(-90, 1335, 380)">
      SHAP value
    </text>

    <!-- Zero line -->
    <line x1="1380" y1="380" x2="1800" y2="380" stroke="#999999" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

    <!-- Scatter points showing negative relationship (threshold effect) -->
    <!-- Low PM2.5: near zero impact -->
    <circle cx="1390" cy="385" r="4" fill="#e8e8e8" opacity="0.6"/>
    <circle cx="1410" cy="380" r="4" fill="#e8e8e8" opacity="0.6"/>
    <circle cx="1430" cy="390" r="4" fill="#e8e8e8" opacity="0.6"/>
    <circle cx="1450" cy="395" r="4" fill="#f7d9d9" opacity="0.6"/>
    <circle cx="1470" cy="400" r="4" fill="#f7d9d9" opacity="0.6"/>

    <!-- Moderate PM2.5: increasingly negative -->
    <circle cx="1500" cy="420" r="4" fill="#f7c9c9" opacity="0.6"/>
    <circle cx="1520" cy="440" r="4" fill="#f7a9a9" opacity="0.6"/>
    <circle cx="1540" cy="455" r="4" fill="#e79999" opacity="0.6"/>
    <circle cx="1560" cy="470" r="4" fill="#d78989" opacity="0.6"/>
    <circle cx="1580" cy="480" r="4" fill="#d9534f" opacity="0.6"/>

    <!-- High PM2.5: strong negative -->
    <circle cx="1610" cy="490" r="4" fill="#c9434f" opacity="0.6"/>
    <circle cx="1630" cy="495" r="4" fill="#b93340" opacity="0.6"/>
    <circle cx="1650" cy="500" r="4" fill="#b40426" opacity="0.6"/>
    <circle cx="1670" cy="503" r="4" fill="#a40426" opacity="0.6"/>
    <circle cx="1690" cy="505" r="4" fill="#940426" opacity="0.6"/>
    <circle cx="1710" cy="507" r="4" fill="#840426" opacity="0.6"/>
    <circle cx="1730" cy="508" r="4" fill="#840426" opacity="0.6"/>
    <circle cx="1750" cy="510" r="4" fill="#740416" opacity="0.6"/>
    <circle cx="1770" cy="511" r="4" fill="#740416" opacity="0.6"/>
    <circle cx="1790" cy="512" r="4" fill="#640406" opacity="0.6"/>

    <!-- Trend line (threshold then linear) -->
    <path d="M 1380 382 L 1480 395 Q 1590 450, 1700 495 Q 1750 505, 1800 512"
          stroke="#cc1a1b"
          stroke-width="3"
          fill="none"
          opacity="0.7"/>
  </g>

  <!-- Interpretation box -->
  <g id="interpretation">
    <rect x="80" y="600" width="1760" height="140" fill="#e3ecfc" rx="8"/>
    <text x="100" y="635" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#2c5cda">
      Key Insights:
    </text>
    <text x="100" y="670" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" fill="#424242">
      • Temperature: Non-linear J-shaped relationship – moderate temps optimal, extreme heat strongly reduces CD4 counts
    </text>
    <text x="100" y="695" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" fill="#424242">
      • Income: Logarithmic relationship – strong positive effect that saturates at higher income levels (~15k/month)
    </text>
    <text x="100" y="720" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" fill="#424242">
      • PM₂.₅: Threshold effect at ~30 µg/m³, then linear negative relationship with air pollution exposure
    </text>
  </g>

  <!-- Method note -->
  <g id="method">
    <rect x="80" y="770" width="1760" height="60" fill="#f4f4f4" rx="8"/>
    <text x="100" y="800" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#666666">
      Generated using Python SHAP package (shap.dependence_plot). Points colored by interaction effects.
    </text>
    <text x="100" y="820" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#666666">
      Trend lines fitted with LOWESS smoothing to highlight non-linear patterns.
    </text>
  </g>

  <!-- Branding -->
  <g id="branding">
    <text x="1850" y="1060"
          text-anchor="end"
          font-family="Inter, Arial, sans-serif"
          font-size="16"
          font-weight="400"
          fill="#999999">
      Wits Planetary Health Research
    </text>
  </g>

</svg>
