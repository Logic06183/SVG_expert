<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif">
  <defs>
    <!-- Gradients for each level -->
    <linearGradient id="ill-level1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4765e;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#c96852;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="ill-level2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e88d6f;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#df7a5d;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="ill-level3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0a384;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#e89272;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="ill-level4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a37fb5;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#9270a6;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="ill-level5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5fa8aa;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4f9799;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="ill-level6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3d8b8d;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2d7a7c;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="ill-level7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a6b6d;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#1d5658;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="1500" fill="#f7fafc"/>

  <!-- Title -->
  <text x="450" y="50" text-anchor="middle" font-size="32" font-weight="700" fill="#2d3748">
    Building Power Together
  </text>
  <text x="450" y="80" text-anchor="middle" font-size="16" fill="#718096">
    A Journey from Struggle to Movement
  </text>

  <!-- Level 1: Everyday Struggle - narrow trapezoid -->
  <g id="ill-level-1" filter="url(#shadow)">
    <path d="M 300 130 L 600 130 L 580 230 L 320 230 Z" fill="url(#ill-level1)" opacity="0.95"/>

    <!-- Icon: Single person (struggle) -->
    <circle cx="450" cy="155" r="12" fill="#fff" opacity="0.9"/>
    <path d="M 450 167 L 450 190 M 440 175 L 460 175 M 450 190 L 440 205 M 450 190 L 460 205"
          stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

    <text x="450" y="145" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">
      Level 1: Everyday Struggle &amp; Exclusion
    </text>
    <text x="450" y="225" text-anchor="middle" font-size="13" fill="#ffffff">
      Documentation • Policing • Clinics • Schools
    </text>
  </g>

  <!-- Connecting flow -->
  <path d="M 450 230 L 450 270" stroke="#8B5A3C" stroke-width="4" opacity="0.5"
        marker-end="url(#arrowhead2)" fill="none"/>

  <!-- Level 2: Survival & Mutual Support - wider -->
  <g id="ill-level-2" filter="url(#shadow)">
    <path d="M 270 270 L 630 270 L 610 400 L 290 400 Z" fill="url(#ill-level2)" opacity="0.95"/>

    <!-- Icon: Two hands clasping (mutual support) -->
    <g transform="translate(450, 295)">
      <path d="M -15 10 Q -15 5 -10 5 L -5 5 L -5 0 L 0 0 L 0 5 L 5 5 L 5 0 L 10 0 L 10 5 L 15 5 Q 20 5 20 10 L 20 25 L -15 25 Z"
            fill="#fff" opacity="0.9"/>
    </g>

    <text x="450" y="340" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">
      Level 2: Survival &amp; Mutual Support
    </text>
    <text x="450" y="360" text-anchor="middle" font-size="12" fill="#ffffff">
      Paralegal accompaniment • WhatsApp networks
    </text>
    <text x="450" y="377" text-anchor="middle" font-size="12" fill="#ffffff">
      Faith solidarity • Women &amp; youth leadership
    </text>
    <text x="450" y="394" text-anchor="middle" font-size="12" fill="#ffffff">
      Safe info-sharing hubs
    </text>
  </g>

  <!-- Connecting flow -->
  <path d="M 450 400 L 450 440" stroke="#8B5A3C" stroke-width="4" opacity="0.5" fill="none"/>

  <!-- Level 3: Quiet Organising - wider still -->
  <g id="ill-level-3" filter="url(#shadow)">
    <path d="M 240 440 L 660 440 L 640 560 L 260 560 Z" fill="url(#ill-level3)" opacity="0.95"/>

    <!-- Icon: Small group of people -->
    <g transform="translate(450, 465)">
      <circle cx="-15" cy="0" r="8" fill="#fff" opacity="0.9"/>
      <circle cx="0" cy="0" r="8" fill="#fff" opacity="0.9"/>
      <circle cx="15" cy="0" r="8" fill="#fff" opacity="0.9"/>
      <path d="M -15 8 L -15 20 M -20 14 L -10 14 M 0 8 L 0 20 M -5 14 L 5 14 M 15 8 L 15 20 M 10 14 L 20 14"
            stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    </g>

    <text x="450" y="505" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">
      Level 3: Quiet Organising &amp; Local Leadership
    </text>
    <text x="450" y="527" text-anchor="middle" font-size="12" fill="#ffffff">
      Refugee-led orgs • Local alliances (markets, schools)
    </text>
    <text x="450" y="544" text-anchor="middle" font-size="12" fill="#ffffff">
      Street committees • Trusted community figures
    </text>
  </g>

  <!-- Connecting flow -->
  <path d="M 450 560 L 450 600" stroke="#8B5A3C" stroke-width="4" opacity="0.5" fill="none"/>

  <!-- Level 4: Collective Action - wider -->
  <g id="ill-level-4" filter="url(#shadow)">
    <path d="M 210 600 L 690 600 L 670 720 L 230 720 Z" fill="url(#ill-level4)" opacity="0.95"/>

    <!-- Icon: Megaphone -->
    <g transform="translate(450, 625)">
      <path d="M -10 0 L 10 -8 L 10 8 Z M 10 -8 Q 20 -10 25 -5 Q 20 0 25 5 Q 20 10 10 8"
            fill="#fff" opacity="0.9" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="27" cy="0" r="2" fill="#fff"/>
      <circle cx="32" cy="0" r="1.5" fill="#fff"/>
    </g>

    <text x="450" y="660" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">
      Level 4: Collective Action &amp; Coordination
    </text>
    <text x="450" y="682" text-anchor="middle" font-size="12" fill="#ffffff">
      Coalition responses to violence • Joint statements
    </text>
    <text x="450" y="699" text-anchor="middle" font-size="12" fill="#ffffff">
      Cross-organisational workshops • Movement convenings
    </text>
  </g>

  <!-- Connecting flow -->
  <path d="M 450 720 L 450 760" stroke="#8B5A3C" stroke-width="4" opacity="0.5" fill="none"/>

  <!-- Level 5: Broad-Based Solidarity - even wider -->
  <g id="ill-level-5" filter="url(#shadow)">
    <path d="M 180 760 L 720 760 L 700 880 L 200 880 Z" fill="url(#ill-level5)" opacity="0.95"/>

    <!-- Icon: Network/web -->
    <g transform="translate(450, 785)" stroke="#fff" stroke-width="2.5" fill="none" opacity="0.9">
      <circle cx="0" cy="0" r="4" fill="#fff"/>
      <circle cx="-20" cy="15" r="4" fill="#fff"/>
      <circle cx="20" cy="15" r="4" fill="#fff"/>
      <circle cx="-15" cy="-15" r="4" fill="#fff"/>
      <circle cx="15" cy="-15" r="4" fill="#fff"/>
      <line x1="0" y1="0" x2="-20" y2="15"/>
      <line x1="0" y1="0" x2="20" y2="15"/>
      <line x1="0" y1="0" x2="-15" y2="-15"/>
      <line x1="0" y1="0" x2="15" y2="-15"/>
      <line x1="-20" y1="15" x2="20" y2="15"/>
      <line x1="-15" y1="-15" x2="15" y2="-15"/>
    </g>

    <text x="450" y="825" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">
      Level 5: Broad-Based Solidarity &amp; Strategy
    </text>
    <text x="450" y="847" text-anchor="middle" font-size="12" fill="#ffffff">
      Health justice alliances • Housing &amp; informal settlement orgs
    </text>
    <text x="450" y="864" text-anchor="middle" font-size="12" fill="#ffffff">
      Youth &amp; feminist ties • Legal networks &amp; advocacy groups
    </text>
  </g>

  <!-- Connecting flow -->
  <path d="M 450 880 L 450 920" stroke="#8B5A3C" stroke-width="4" opacity="0.5" fill="none"/>

  <!-- Level 6: Movement Infrastructure - very wide -->
  <g id="ill-level-6" filter="url(#shadow)">
    <path d="M 150 920 L 750 920 L 730 1100 L 170 1100 Z" fill="url(#ill-level6)" opacity="0.95"/>

    <!-- Icon: Building/pillars -->
    <g transform="translate(450, 945)" fill="#fff" opacity="0.9">
      <rect x="-25" y="0" width="8" height="30" rx="1"/>
      <rect x="-8" y="0" width="8" height="30" rx="1"/>
      <rect x="9" y="0" width="8" height="30" rx="1"/>
      <rect x="-30" y="-5" width="52" height="4" rx="1"/>
      <rect x="-30" y="30" width="52" height="3" rx="1"/>
    </g>

    <text x="450" y="995" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">
      Level 6: Movement Infrastructure Pillars
    </text>
    <text x="450" y="1017" text-anchor="middle" font-size="11.5" fill="#ffffff">
      Shared narrative + anti-xenophobia frame
    </text>
    <text x="450" y="1034" text-anchor="middle" font-size="11.5" fill="#ffffff">
      Leadership development (women/youth/migrant-led)
    </text>
    <text x="450" y="1051" text-anchor="middle" font-size="11.5" fill="#ffffff">
      Coordinating structures • Pooled flexible funding
    </text>
    <text x="450" y="1068" text-anchor="middle" font-size="11.5" fill="#ffffff">
      Community defence networks • Policy + litigation strategy
    </text>
  </g>

  <!-- Connecting flow -->
  <path d="M 450 1100 L 450 1140" stroke="#8B5A3C" stroke-width="5" opacity="0.5" fill="none"/>

  <!-- Level 7: Powerful Movement - widest, strongest -->
  <g id="ill-level-7" filter="url(#shadow)">
    <path d="M 100 1140 L 800 1140 L 780 1280 L 120 1280 Z" fill="url(#ill-level7)"/>

    <!-- Icon: Raised fists (solidarity) -->
    <g transform="translate(450, 1170)" fill="#fff" opacity="0.95">
      <g transform="translate(-25, 0)">
        <rect x="-3" y="10" width="6" height="15" rx="1"/>
        <circle cx="0" cy="10" r="5"/>
      </g>
      <g transform="translate(-8, -5)">
        <rect x="-3" y="10" width="6" height="20" rx="1"/>
        <circle cx="0" cy="10" r="5"/>
      </g>
      <g transform="translate(8, -5)">
        <rect x="-3" y="10" width="6" height="20" rx="1"/>
        <circle cx="0" cy="10" r="5"/>
      </g>
      <g transform="translate(25, 0)">
        <rect x="-3" y="10" width="6" height="15" rx="1"/>
        <circle cx="0" cy="10" r="5"/>
      </g>
    </g>

    <text x="450" y="1225" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">
      POWERFUL, INCLUSIVE MOVEMENT
    </text>
    <text x="450" y="1255" text-anchor="middle" font-size="19" font-weight="600" fill="#ffffff">
      for Dignity, Belonging, &amp; Equal Rights
    </text>
  </g>

  <!-- Footer -->
  <text x="450" y="1340" text-anchor="middle" font-size="13" fill="#4a5568" font-style="italic">
    Building collective power for refugee and migrant justice in South Africa
  </text>

  <!-- Legend showing progression -->
  <g id="legend" transform="translate(100, 1380)">
    <text x="0" y="0" font-size="11" fill="#718096" font-weight="600">Individual Struggle</text>
    <rect x="110" y="-8" width="40" height="3" fill="#d4765e"/>
    <path d="M 155 -6.5 L 165 -6.5 L 162 -9 L 165 -6.5 L 162 -4" stroke="#718096" stroke-width="1.5" fill="none"/>
    <rect x="170" y="-8" width="40" height="3" fill="#5fa8aa"/>
    <path d="M 215 -6.5 L 225 -6.5 L 222 -9 L 225 -6.5 L 222 -4" stroke="#718096" stroke-width="1.5" fill="none"/>
    <rect x="230" y="-8" width="40" height="3" fill="#2a6b6d"/>
    <text x="280" y="0" font-size="11" fill="#718096" font-weight="600">Collective Movement</text>
  </g>
</svg>